<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fe de Jesús</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#fafafa;color:#262626;padding-bottom:40px}
.wrap{max-width:600px;margin:0 auto}
header{position:sticky;top:0;background:rgba(250,250,250,.94);backdrop-filter:blur(12px);border-bottom:1px solid #dbdbdb;z-index:20}
.hrow{display:flex;align-items:center;gap:10px;padding:12px 16px}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);display:flex;align-items:center;justify-content:center;padding:2.5px}
.avatar span{background:#fff;width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px}
.logo{font-weight:800;font-size:20px;line-height:1.1}
.logo small{display:block;font-weight:400;font-size:12px;color:#8e8e8e}
.pill{margin-left:auto;background:#fff;border:1px solid #dbdbdb;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600}
.stories{display:flex;gap:14px;overflow-x:auto;padding:14px 16px;background:#fff;border-bottom:1px solid #efefef;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.st{flex:0 0 auto;text-align:center;cursor:pointer}
.ring{width:58px;height:58px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.ring.done{background:#00a86b}
.ring span{width:100%;height:100%;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 0 0 1px #dbdbdb}
.st small{display:block;font-size:10px;color:#555;margin-top:4px}
.hero{margin:16px;border-radius:18px;overflow:hidden;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.18);background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.hero .in{padding:26px 22px}
.hero h1{font-size:27px;font-weight:800}
.hero p{opacity:.92;margin-top:6px;font-size:14px}
.bar{height:6px;background:rgba(255,255,255,.3);border-radius:4px;margin-top:16px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:4px;transition:width .4s}
.btn{display:inline-block;margin-top:14px;background:#fff;color:#111;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
.btn:active{transform:scale(.97)}
.sec{padding:0 16px}
.sec h2{font-size:13px;color:#8e8e8e;margin:20px 4px 10px;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.card{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid #efefef;border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer;text-decoration:none;color:inherit}
.card:active{transform:scale(.98)}
.thumb{width:54px;height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 auto}
.tx{flex:1;min-width:0}
.d{font-size:11px;color:#8e8e8e;font-weight:700;letter-spacing:.5px}
.card h3{font-size:15px;line-height:1.3;margin-top:2px}
.stx{font-size:12px;margin-top:3px;color:#8e8e8e}
.ok{color:#00a86b;font-weight:700}
.he{font-size:18px}
footer{text-align:center;color:#c7c7c7;font-size:12px;padding:24px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="hrow">
      <div class="avatar"><span>📖</span></div>
      <div class="logo">Fe de Jesús<small>20 estudios bíblicos · 20 días</small></div>
      <div class="pill" id="pill">0/20</div>
    </div>
  </header>

  <div class="stories" id="stories"></div>

  <div class="hero">
    <div class="in">
      <h1>Un camino de 20 días</h1>
      <p>Un estudio por día, de la Biblia al bautismo. Tocá cualquier referencia y leé el versículo al instante.</p>
      <div class="bar"><i id="barra" style="width:0%"></i></div>
      <button class="btn" id="btnContinuar">▶ Comenzar</button>
    </div>
  </div>

  <div class="sec">
    <h2>Índice del curso</h2>
    <div id="lista"></div>
  </div>

  <footer>Fe de Jesús · "JESÚS VIENE PRONTO"</footer>
</div>

<script src="data.js"></script>
<script src="data-a.js"></script>
<!-- Descomentar al subir los siguientes archivos:
<script src="data-b.js"></script>
<script src="data-c.js"></script>
<script src="data-d.js"></script>
-->

<script>
const done = () => JSON.parse(localStorage.getItem("fej_done") || "{}");

function gradiente(e){
  const gs = ["linear-gradient(135deg,#134e5e,#71b280)","linear-gradient(135deg,#2c3e50,#4a69bd)","linear-gradient(135deg,#42275a,#734b6d)","linear-gradient(135deg,#373b44,#4286f4)","linear-gradient(135deg,#870000,#190a05)","linear-gradient(135deg,#1a2980,#26d0ce)","linear-gradient(135deg,#b79891,#94716b)","linear-gradient(135deg,#c31432,#240b36)","linear-gradient(135deg,#141e30,#243b55)","linear-gradient(135deg,#606c88,#3f4c6b)","linear-gradient(135deg,#5f9ea0,#2f4f4f)","linear-gradient(135deg,#00c6fb,#005bea)","linear-gradient(135deg,#2193b0,#6dd5ed)","linear-gradient(135deg,#355c7d,#6c5b7b)","linear-gradient(135deg,#0f2027,#2c5364)","linear-gradient(135deg,#56ab2f,#a8e063)","linear-gradient(135deg,#11998e,#38ef7d)","linear-gradient(135deg,#f7971e,#ffd200)","linear-gradient(135deg,#654ea3,#eaafc8)","linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)"];
  return gs[(e.d - 1) % gs.length];
}

function render(){
  const total = LECCIONES.length;
  const doneMap = done();
  const nDone = Object.keys(doneMap).length;

  document.getElementById("pill").textContent = nDone + "/20";
  document.getElementById("barra").style.width = (nDone / 20 * 100) + "%";
  document.getElementById("btnContinuar").textContent = nDone ? "▶ Continuar" : "▶ Comenzar";
  document.getElementById("btnContinuar").onclick = () => {
    const prox = LECCIONES.find(l => !doneMap[l.d]) || LECCIONES[0];
    location.href = "leccion.html?dia=" + prox.d;
  };

  document.getElementById("stories").innerHTML = LECCIONES.map(l =>
    `<div class="st" onclick="location.href='leccion.html?dia=${l.d}'">
       <div class="ring ${doneMap[l.d] ? "done" : ""}"><span>${l.e}</span></div>
       <small>Día ${l.d}</small>
     </div>`).join("");

  document.getElementById("lista").innerHTML = LECCIONES.map(l => {
    const hecho = doneMap[l.d];
    return `<a class="card" href="leccion.html?dia=${l.d}">
      <div class="thumb" style="background:${l.g}">${l.e}</div>
      <div class="tx">
        <div class="d">DÍA ${l.d}</div>
        <h3>${l.t}</h3>
        <div class="stx ${hecho ? "ok" : ""}">${hecho ? "✓ Completado" : "Sin completar"}</div>
      </div>
      <div class="he">${hecho ? "❤️" : "🤍"}</div>
    </a>`;
  }).join("");
}
render();
</script>
</body>
</html>
