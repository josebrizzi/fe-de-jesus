<script>
/* ===== QUIZ DE APÓCALIPSIS — Fe de Jesús (v12) =====
   El mismo juego de "Poné a prueba tu fe" del curso de 20 días,
   ahora para las 18 lecciones del estudio de Apocalipsis.
   Aquí SÍ hay corrección inmediata (a diferencia del estudio, que se
   responde a ciegas). Sin candados: cualquier lección se puede jugar
   en cualquier momento. El puntaje queda guardado en el celular
   (localStorage, clave fejapo_qgame_v1) y se puede compartir por
   WhatsApp con el instructor conectado. */

/* ===== MODO CLARO / OSCURO ===== */
function aplicarIconoTema(){
  const b = document.getElementById("btnTema");
  if(b) b.textContent = document.documentElement.classList.contains("modo-oscuro") ? "☀️" : "🌙";
}
function toggleTema(){
  const oscuro = document.documentElement.classList.toggle("modo-oscuro");
  try{ localStorage.setItem("fej_tema", oscuro ? "oscuro" : "claro"); }catch(e){}
  aplicarIconoTema();
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", oscuro ? "#18191a" : "#6a1b9a");
}
document.getElementById("btnTema").onclick = toggleTema;
aplicarIconoTema();

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("on");
  setTimeout(() => t.classList.remove("on"), 2600);
}
</script>
<script>
/* ===== VISOR DE BIBLIA (igual que leccion.html y quiz.html) ===== */
let API_BASE = null, BIBLE_VERSION = "RVR1960", apiOK = false;
async function discover(){
  if(API_BASE !== null) return;
  const bases = ["", "/fe-de-jesus", "..", "/biblia"];
  for(const b of bases){
    try{
      const r = await fetch(b + "/api/versions");
      if(!r.ok) continue;
      const vs = await r.json();
      API_BASE = b;
      BIBLE_VERSION = vs.find(v => /rvr.*196|1960/i.test(v)) || vs.find(v => /rvr/i.test(v)) || vs[0];
      apiOK = true;
      return;
    }catch(e){}
  }
  API_BASE = "";
}

const LIBROS = [
["Génesis","Gén","Gn","Gen",1],["Éxodo","Exodo","Éxo","Exo",2],["Levítico","Lev",3],["Números","Núm","Nm","Num",4],
["Deuteronomio","Deut","Dt",5],["Josué","Jos",6],["Jueces","Jue",7],["Rut","Rt",8],
["1 Samuel","1 Sam",9],["2 Samuel","2 Sam",10],["1 Reyes","1 Rey",11],["2 Reyes","2 Rey",12],
["1 Crónicas","1 Crón","1 Cro",13],["2 Crónicas","2 Crón","2 Cro",14],["Esdras","Esd",15],["Nehemías","Neh",16],
["Ester","Est",17],["Job",18],["Salmos","Salmo","Sal",19],["Proverbios","Prov",20],
["Eclesiastés","Ecl",21],["Cantares","Cant",22],["Isaías","Isa","Is",23],["Jeremías","Jer",24],
["Lamentaciones","Lam",25],["Ezequiel","Eze",26],["Daniel","Dan",27],["Oseas","Os",28],
["Joel",29],["Amós","Am",30],["Obadías","Obad",31],["Jonás","Jon",32],["Miqueas","Miq",33],
["Nahúm","Nah",34],["Habacuc","Hab",35],["Sofonías","Sof",36],["Hageo","Hag",37],
["Zacarías","Zac",38],["Malaquías","Mal",39],["Mateo","Mt",40],["Marcos","Mr","Mar",41],
["Lucas","Lc","Luc",42],["Juan","Jn",43],["Hechos","Hch","Hech",44],["Romanos","Rom","Ro",45],
["1 Corintios","1 Cor",46],["2 Corintios","2 Cor",47],["Gálatas","Gál","Gal",48],["Efesios","Efes","Ef",49],
["Filipenses","Filip","Fil",50],["Colosenses","Colos","Col",51],["1 Tesalonicenses","1 Tes",52],
["2 Tesalonicenses","2 Tes",53],["1 Timoteo","1 Tim",54],["2 Timoteo","2 Tim",55],["Tito","Tit",56],
["Filemón","Filem",57],["Hebreos","Heb",58],["Santiago","Stg","Sant",59],["1 Pedro","1 Ped",60],
["2 Pedro","2 Ped",61],["1 Juan","1 Jn",62],["2 Juan","2 Jn",63],["3 Juan","3 Jn",64],
["Judas","Jud",65],["Apocalipsis","Apoc","Ap",66]
];

function norm(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim(); }
const reLibros = LIBROS.flatMap(g => g.slice(0,-1)).sort((a,b) => b.length - a.length).map(x => x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|");
const V = "(\\d{1,3}(?:\\s?[-–—]\\s?\\d{1,3}(?::\\d{1,3})?)?(?:\\s?,\\s?\\d{1,3}(?:\\s?[-–—]\\s?\\d{1,3})?)*)";
const REF_RE = new RegExp("(?<![\\p{L}\\p{N}])((?:" + reLibros + ")\\.?\\s?\\d{1,3}(?::\\s?" + V + ")?)", "gu");
const REF_ONE = new RegExp("^(" + reLibros + ")\\.?\\s?(\\d{1,3})(?::\\s?" + V + ")?$","u");

function numeroLibro(nombre){
  const n = norm(nombre.replace(/\.$/,""));
  const g = LIBROS.find(g => g.slice(0,-1).some(a => norm(a) === n));
  return g ? g[g.length-1] : null;
}
function escapeHtml(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function linkRefs(texto){ return escapeHtml(texto).replace(REF_RE, (m, ref) => '<a class="ref" data-r="' + ref + '">' + ref + '</a>'); }
function chips(refs){
  const partes = String(refs || "").split(";").map(s => s.trim()).filter(Boolean);
  let libroPrev = "";
  return partes.map(p => {
    const m = p.match(/^([A-Za-zÁÉÍÓÚÜÑáéíóúüñ][^\d]*?)\.?\s?\d/);
    if(m && numeroLibro(m[1])) libroPrev = m[1].replace(/\.$/,"");
    else if(libroPrev) p = libroPrev + " " + p;
    return p;
  });
}
function parseOne(ref){
  const m = ref.replace(/\s+/g," ").match(REF_ONE);
  if(!m) return null;
  const b = numeroLibro(m[1]);
  if(!b) return null;
  return { b, c: +m[2], versos: m[3] || null };
}
async function fetchCap(b, c){
  const r = await fetch(API_BASE + "/api/verses?version=" + encodeURIComponent(BIBLE_VERSION) + "&book=" + b + "&chapter=" + c);
  if(!r.ok) throw 0;
  return r.json();
}
async function openRef(ref){
  const p = parseOne(ref);
  if(!p){ return; }
  document.getElementById("shRef").textContent = ref;
  document.getElementById("shVer").textContent = "Cargando…";
  document.getElementById("shBody").innerHTML = "";
  abrirSheet();
  try{
    await discover();
    let caps = [p.c];
    let rango = null;
    if(p.versos){
      const rm = p.versos.match(/^(\d+)\s?[-–—]\s?(\d{1,3})(?::(\d{1,3}))?$/);
      if(rm && rm[2]){
        if(rm[3] !== undefined){ caps = [+p.c, +rm[2]]; rango = { de:+rm[1], hasta:+rm[3], capFin:+rm[2] }; }
        else rango = { de:+p.versos.match(/^\d+/)[0], hasta:+rm[2], capFin:+p.c };
      } else if(p.versos.includes(",")){
        rango = { lista: p.versos.split(",").map(s=>+s.trim()) };
      } else if(/^\d+$/.test(p.versos.trim())){
        rango = { lista: [ +p.versos.trim() ] };
      }
    }
    const datos = await Promise.all(caps.map(c => fetchCap(p.b, c)));
    let html = "";
    const pintar = (versos, capN) => {
      let sel = versos;
      if(rango){
        if(rango.lista) sel = versos.filter(v => rango.lista.includes(+v.verse));
        else sel = versos.filter(v => +v.verse >= rango.de && +v.verse <= (capN === rango.capFin ? rango.hasta : 999));
      }
      sel.forEach(v => { html += '<p><sup>' + v.verse + '</sup>' + escapeHtml(v.text) + '</p>'; });
    };
    caps.forEach((c,i) => pintar(datos[i], c));
    document.getElementById("shVer").textContent = BIBLE_VERSION + (apiOK ? "" : " · modo sin conexión");
    document.getElementById("shBody").innerHTML = html || "<p>No se encontraron los versículos.</p>";
  }catch(e){
    document.getElementById("shVer").textContent = "";
    document.getElementById("shBody").innerHTML = '<p style="color:var(--texto2)">No se pudo cargar el texto bíblico. Verificá la conexión con la API de la Biblia.</p><p><a class="ref" style="pointer-events:none">' + ref + '</a></p>';
  }
}
function abrirSheet(){
  document.getElementById("sheet").classList.add("on");
  document.getElementById("overlay").classList.add("on");
}
function cerrarSheet(){
  document.getElementById("sheet").classList.remove("on");
  document.getElementById("overlay").classList.remove("on");
}
document.addEventListener("click", e => {
  const a = e.target.closest("a.ref");
  if(a) openRef(a.dataset.r);
});

/* ===== MEZCLA (Fisher-Yates). La correcta (posición 0 en las ops) viaja por su texto ===== */
function mezclar(arr){
  const a = arr.map(x => x);
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* "Ninguna de las anteriores es correcta" NO se mezcla: queda siempre al final,
   después de las opciones reales (igual que en la lección, antes del instructor) */
const RX_NINGUNA = /ninguna de las anteriores/i;
function mezclarOps(ops){
  const ult = ops.filter(o => RX_NINGUNA.test(o));
  const resto = ops.filter(o => !RX_NINGUNA.test(o));
  return mezclar(resto).concat(ult);
}

/* ===== PERSISTENCIA ===== */
const QGKEY = "fejapo_qgame_v1";
const getQG = () => { try{ return JSON.parse(localStorage.getItem(QGKEY) || "{}"); }catch(e){ return {}; } };
const saveQG = o => { try{ localStorage.setItem(QGKEY, JSON.stringify(o)); }catch(e){} };
const getDone = () => { try{ return JSON.parse(localStorage.getItem("fejapo_done") || "{}"); }catch(e){ return {}; } };

function estrellas(pct){ return pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0; }
function msj(pct){
  return pct === 100 ? "🎉 ¡Perfecto! La profecía está en tu corazón"
    : pct >= 90 ? "🌟 ¡Excelente! Casi perfecto"
    : pct >= 70 ? "💪 ¡Muy bien! Repasá lo que fallaste"
    : pct >= 50 ? "🌱 Buen comienzo: un repaso más y la tenés"
    : "🙏 No te desanimes: volvé a leer la lección e intentá de nuevo";
}

/* ===== BANCO DE PREGUNTAS (desde LECCIONES_APO — las ops ya vienen en cada pregunta, la PRIMERA es la correcta) ===== */
function bancoLeccion(d){
  const L = LECCIONES_APO.find(x => x.d === d);
  if(!L) return [];
  const out = [];
  (L.temas || []).forEach(t => (t.ps || []).forEach(p => {
    const ops = Array.isArray(p.ops) ? p.ops : [];
    if(ops.length < 2) return; /* las preguntas de escribir no van al quiz */
    out.push({
      d: d, n: p.n, q: p.p, ref: p.r || "",
      ops: ops,
      ok: ops[0],
      exp: p.des || ""
    });
  }));
  return out;
}
function bancoTodo(){
  let a = [];
  for(let d = 1; d <= 18; d++) a = a.concat(bancoLeccion(d));
  return a;
}

/* ===== ESTADO DEL JUEGO ===== */
let juego = null;

function nuevoJuego(modo, dia){
  let lista;
  if(modo === "dia"){
    lista = bancoLeccion(dia);
    if(!lista.length){ toast("Esta lección todavía no tiene preguntas de quiz"); return; }
  } else {
    const doneMap = getDone();
    const lecsHechas = Object.keys(doneMap).map(Number).filter(d => d >= 1 && d <= 18);
    /* Si ya avanzó en el estudio, el repaso prioriza las lecciones que estudió; si no, usa las 18 */
    const lecs = lecsHechas.length >= 6 ? lecsHechas : Array.from({length:18}, (_, i) => i + 1);
    lista = mezclar(lecs)
      .map(d => { const b = bancoLeccion(d); return b.length ? b[Math.floor(Math.random() * b.length)] : null; })
      .filter(Boolean)
      .slice(0, 12);
  }
  juego = {
    modo: modo, dia: dia,
    lista: lista.map(it => Object.assign({}, it, { mezcladas: mezclarOps(it.ops) })),
    idx: 0, aciertos: 0, resps: []
  };
  render();
  window.scrollTo(0, 0);
}

/* ===== VISTAS ===== */
function render(){
  if(!juego) renderHome();
  else if(juego.idx >= juego.lista.length) renderResultado();
  else renderPregunta();
}

function renderHome(){
  document.getElementById("hdTitle").textContent = "Quiz";
  document.title = "Quiz Apocalipsis — Fe de Jesús";
  const qg = getQG();
  const doneMap = getDone();
  let aprobados = 0;
  const tarjetas = LECCIONES_APO.map(l => {
    const st = qg[l.d];
    const es = st ? (st.stars || 0) : 0;
    if(es >= 1) aprobados++;
    const hecho = !!doneMap[l.d];
    const derecha = st
      ? '<span class="badge">' + (es ? "⭐".repeat(es) + " " : "") + st.best + '%</span>'
      : '<span class="jugar">Jugar ▶</span>';
    return '<a class="qcard" href="javascript:void(0)" onclick="nuevoJuego(\'dia\',' + l.d + ')">' +
      '<div class="thumb" style="background:' + l.g + '">' + l.e + '</div>' +
      '<div class="tx"><div class="d">LECCIÓN ' + l.d + (hecho ? ' · ✓ COMPLETADA' : '') + '</div>' +
      '<h3>' + escapeHtml(l.t) + '</h3>' +
      (hecho ? '' : '<div class="mini">💡 Hacé primero la Lección ' + l.d + '</div>') +
      '</div>' + derecha + '</a>';
  }).join("");
  const rp = qg.repaso;
  document.getElementById("qapp").innerHTML =
    '<div class="hero"><div class="in">' +
      '<h1>🎮 Poné a prueba tu fe</h1>' +
      '<p>Repasá lo aprendido con las preguntas de las 18 lecciones del Apocalipsis. Elegí una lección o mezclá todo en el repaso general. Acá sí se corrige al instante: cada respuesta viene con su enseñanza.</p>' +
      '<div class="bar"><i style="width:' + (aprobados / 18 * 100) + '%"></i></div>' +
      '<div class="hsub">⭐ ' + aprobados + ' de 18 lecciones aprobadas' + (rp && rp.best ? ' · Repaso general: ' + rp.best + '%' : '') + '</div>' +
    '</div></div>' +
    '<div class="sec"><h2>Repaso general</h2>' +
      '<a class="qcard rep" href="javascript:void(0)" onclick="nuevoJuego(\'repaso\')">' +
        '<div class="thumb" style="background:linear-gradient(135deg,#f7971e,#ffd200)">🎲</div>' +
        '<div class="tx"><div class="d">12 PREGUNTAS MEZCLADAS</div><h3>De todas las lecciones del Apocalipsis</h3></div>' +
        (rp && rp.best ? '<span class="badge">' + rp.best + '%</span>' : '<span class="jugar">Jugar ▶</span>') +
      '</a>' +
    '</div>' +
    '<div class="sec"><h2>Quiz por lección</h2>' + tarjetas + '</div>' +
    '<div class="sec"><div class="card" style="font-size:14px;line-height:1.6;color:var(--texto2)">📝 El quiz es un <b style="color:var(--texto)">repaso para vos</b>: no reemplaza la lección y no se envía al instructor, salvo que vos toques «Compartir mi resultado». Tu mejor puntaje queda guardado en este celular.</div></div>';
}

function renderPregunta(){
  const j = juego;
  const it = j.lista[j.idx];
  const total = j.lista.length;
  document.getElementById("hdTitle").textContent = j.modo === "dia" ? "Quiz · Lección " + j.dia : "Repaso general";
  document.title = "Quiz Apocalipsis — " + (j.modo === "dia" ? "Lección " + j.dia : "Repaso") + " — Fe de Jesús";
  const LETRAS = ["A","B","C","D"];
  const botones = it.mezcladas.map((o, i) =>
    '<button type="button" class="opt" data-t="' + escapeHtml(o) + '">' +
      '<span class="letra">' + LETRAS[i] + '</span><span>' + escapeHtml(o) + '</span></button>').join("");
  document.getElementById("qapp").innerHTML =
    '<div class="pinfo"><b>Pregunta ' + (j.idx + 1) + '</b> de ' + total + ' &nbsp;·&nbsp; ✅ ' + j.aciertos + ' correctas</div>' +
    '<div class="pbar"><i style="width:' + (j.idx / total * 100) + '%"></i></div>' +
    '<section class="card">' +
      '<span class="pnum">' + it.n + '</span><span class="pq">' + escapeHtml(it.q) + '</span>' +
      '<div class="chips">' + chips(it.ref).map(c =>
        '<button class="chip" onclick="openRef(\'' + c.replace(/'/g,"\\'") + '\')">' + escapeHtml(c) + '</button>').join("") + '</div>' +
      '<div class="quiz" id="opts">' + botones + '</div>' +
      '<div id="fb"></div>' +
    '</section>';
}

function responder(b){
  const j = juego;
  const it = j.lista[j.idx];
  if(j.resps[j.idx]) return; /* ya respondida */
  const sel = b.getAttribute("data-t");
  const ok = sel === it.ok;
  j.resps[j.idx] = { sel: sel, ok: ok };
  if(ok) j.aciertos++;
  document.querySelectorAll("#opts .opt").forEach(o => {
    o.disabled = true;
    const t = o.getAttribute("data-t");
    if(t === it.ok) o.classList.add("ok");
    else if(o === b){ o.classList.add("err"); o.classList.add("mal"); }
  });
  const fb = document.getElementById("fb");
  fb.innerHTML =
    '<div class="fbttl ' + (ok ? "b" : "m") + '">' + (ok ? "✅ ¡Correcto!" : "❌ La correcta es: " + escapeHtml(it.ok)) + '</div>' +
    (it.exp ? '<div class="explica"><div class="des">' + linkRefs(it.exp) + '</div></div>' : '') +
    '<button class="next" data-next="1">' + (j.idx + 1 === j.lista.length ? "Ver resultado 🏁" : "Siguiente ▶") + '</button>';
  const pi = document.querySelector(".pinfo");
  if(pi) pi.innerHTML = '<b>Pregunta ' + (j.idx + 1) + '</b> de ' + j.lista.length + ' &nbsp;·&nbsp; ✅ ' + j.aciertos + ' correctas';
  fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function renderResultado(){
  const j = juego;
  const total = j.lista.length;
  const pct = Math.round(j.aciertos / total * 100);
  const es = estrellas(pct);

  /* guardar puntaje */
  const qg = getQG();
  if(j.modo === "dia"){
    const st = qg[j.dia] || { best: 0, stars: 0, plays: 0 };
    st.plays++;
    if(pct > st.best) st.best = pct;
    if(es > (st.stars || 0)) st.stars = es;
    try{ st.last = new Date().toLocaleDateString("es-AR"); }catch(e){}
    qg[j.dia] = st;
  } else {
    const rp = qg.repaso || { best: 0, plays: 0 };
    rp.plays++;
    if(pct > rp.best) rp.best = pct;
    qg.repaso = rp;
  }
  saveQG(qg);

  const L = LECCIONES_APO.find(x => x.d === j.dia);
  const titulo = j.modo === "dia" ? "🔥 Lección " + j.dia + " · " + (L ? L.t : "") : "🎲 Repaso general";
  const resumen = j.lista.map((it, i) => {
    const r = j.resps[i] || { sel: "—", ok: false };
    return '<div class="rev">' +
      '<div class="revq"><b>' + (i + 1) + '.</b> ' + escapeHtml(it.q) + ' <span class="revref">(' + escapeHtml(it.ref) + ')</span></div>' +
      '<div class="revy ' + (r.ok ? "ok" : "mal") + '">Tu respuesta: ' + escapeHtml(r.sel) + (r.ok ? " ✓" : "") + '</div>' +
      (r.ok ? '' : '<div class="revok">Correcta: ' + escapeHtml(it.ok) + '</div>') +
      (it.exp ? '<details class="revd"><summary>💡 ¿Por qué?</summary><div class="des">' + linkRefs(it.exp) + '</div></details>' : '') +
    '</div>';
  }).join("");

  document.getElementById("hdTitle").textContent = "Resultado";
  document.getElementById("qapp").innerHTML =
    '<div class="hero res"><div class="in">' +
      '<div class="pct">' + pct + '%</div>' +
      '<div class="stars">' + (es ? "⭐".repeat(es) : "🌱") + '</div>' +
      '<div class="rmsg">' + msj(pct) + '</div>' +
      '<div class="rsub">' + escapeHtml(titulo) + '<br>🎯 ' + j.aciertos + ' de ' + total + ' correctas</div>' +
    '</div></div>' +
    '<div class="btns">' +
      '<button class="nbtn prim" onclick="reintentar()">🔁 ' + (j.modo === "dia" ? "Reintentar la Lección " + j.dia : "Otro repaso") + '</button>' +
      '<button class="nbtn ver" onclick="compartir()">📲 Compartir mi resultado</button>' +
      '<button class="nbtn" onclick="juego=null;render()">🏠 Inicio del Quiz</button>' +
    '</div>' +
    '<div class="sec"><h2>Revisión pregunta por pregunta</h2>' + resumen + '</div>';
}

function reintentar(){
  const m = juego.modo, d = juego.dia;
  juego = null;
  nuevoJuego(m, d);
}

function compartir(){
  const j = juego;
  const total = j.lista.length;
  const pct = Math.round(j.aciertos / total * 100);
  const es = estrellas(pct);
  const L = LECCIONES_APO.find(x => x.d === j.dia);
  const lineas = [
    "🎮 *Quiz Apocalipsis — Fe de Jesús*", "",
    (j.modo === "dia" ? "🔥 Lección " + j.dia + " · " + (L ? L.t : "") : "🎲 Repaso general"),
    "🎯 " + j.aciertos + "/" + total + " correctas (" + pct + "%)",
    es ? "⭐".repeat(es) : "🌱 Sigo estudiando", "",
    "¡Sigo avanzando en el estudio de Apocalipsis! 🙌"
  ];
  const tel = (typeof window.fejTelDestino === "function") ? window.fejTelDestino() : "5491128945261";
  window.open("https://wa.me/" + tel + "?text=" + encodeURIComponent(lineas.join("\n")), "_blank");
}

/* ===== CLICS ===== */
document.getElementById("qapp").addEventListener("click", function(e){
  const b = e.target.closest(".opt");
  if(b && document.getElementById("opts") && !b.disabled){ responder(b); return; }
  const nb = e.target.closest("[data-next]");
  if(nb){ juego.idx++; render(); window.scrollTo(0, 0); }
});

/* ===== ARRANQUE (soporta apo-quiz.html?l=N para abrir una lección directa) ===== */
(function(){
  const p = new URLSearchParams(location.search);
  const d = +p.get("l");
  if(d >= 1 && d <= 18) nuevoJuego("dia", d);
  else render();
})();

console.log("Fe de Jesús: quiz de Apocalipsis cargado ✓");
</script>
