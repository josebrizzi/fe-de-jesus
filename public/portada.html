<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fe de Jesús</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#fafafa;color:#262626;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.tarjeta{max-width:420px;width:100%;text-align:center}
.avatar{width:96px;height:96px;border-radius:50%;margin:0 auto;background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);display:flex;align-items:center;justify-content:center;padding:4px;box-shadow:0 10px 30px rgba(220,39,67,.3)}
.avatar span{background:#fff;width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:46px}
h1{font-size:30px;font-weight:800;margin-top:18px}
h1 small{display:block;font-size:14px;font-weight:400;color:#8e8e8e;margin-top:6px}
.btn{display:inline-block;margin-top:26px;background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);color:#fff;text-decoration:none;border-radius:14px;padding:16px 40px;font-size:17px;font-weight:800;box-shadow:0 6px 18px rgba(220,39,67,.35)}
.btn:active{transform:scale(.97)}
footer{margin-top:30px;color:#c7c7c7;font-size:12px}
</style>
</head>
<body>
  <div class="tarjeta">
    <div class="avatar"><span>📖</span></div>
    <h1>Fe de Jesús<small>20 estudios bíblicos · 20 días</small></h1>
    <a class="btn" href="estudios/">📚 Entrar a los estudios</a>
    <footer>"JESÚS VIENE PRONTO"</footer>
  </div>
</body>
</html>
