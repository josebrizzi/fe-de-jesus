<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fe de Jesús</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#fafafa;color:#262626;padding-bottom:90px}
header{position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid #dbdbdb;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 14px}
header button{background:none;border:none;font-size:22px;cursor:pointer}
header .t{flex:1;font-weight:700;font-size:15px}
#btnDone{font-size:24px}
.wrap{max-width:620px;margin:0 auto;padding:0 14px}
.hero{margin:16px 0;border-radius:18px;color:#fff;padding:30px 22px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.hero .dia{font-size:12px;font-weight:800;letter-spacing:2px;opacity:.9}
.hero .em{font-size:52px;margin:6px 0}
.hero h1{font-size:24px;font-weight:800;line-height:1.2}
.card{background:#fff;border:1px solid #efefef;border-radius:14px;padding:18px 16px;margin:12px 0}
.card h2{font-size:17px;margin-bottom:10px}
.card h3{font-size:15px;margin:16px 0 6px}
.intro{font-size:15px;line-height:1.6;color:#444}
.preg{border-left:3px solid #0095f6;padding-left:12px;margin:18px 0}
.pnum{display:inline-flex;width:24px;height:24px;border-radius:50%;background:#0095f6;color:#fff;font-size:12px;font-weight:700;align-items:center;justify-content:center;margin-right:6px;vertical-align:middle}
.pq{font-size:15px;font-weight:700;display:inline;vertical-align:middle}
.chips{margin:8px 0;display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#e8f3fd;color:#0095f6;border:none;border-radius:16px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip:active{background:#cde8fc}
.resp{display:inline-block;background:#e8f8ef;color:#00a86b;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;margin:6px 0}
.des{font-size:15px;line-height:1.65;color:#333}
a.ref{color:#0095f6;text-decoration:none;font-weight:600;cursor:pointer;border-bottom:1px dotted #99c9f0}
.egw{background:#f7f4ee;border-left:4px solid #b79a5f;border-radius:10px;padding:14px;margin-top:12px;font-size:14px;line-height:1.6;font-style:italic;color:#555}
.egw b{display:block;font-style:normal;font-size:12px;color:#8a744a;margin-top:8px}
.pillr{display:inline-block;background:#e8f8ef;color:#00a86b;border-radius:14px;padding:4px 10px;font-size:12px;font-weight:700;margin:4px 6px 4px 0}
ul.lis{list-style:none;margin-top:6px}
ul.lis li{padding:9px 0;border-bottom:1px solid #f2f2f2;font-size:15px;line-height:1.55}
ul.lis li:last-child{border:none}
.dec{background:#fff;border:2px solid #ff5c8a;border-radius:14px;padding:18px 16px;margin:12px 0}
.dec h2{font-size:16px}
.dec p{font-size:15px;line-height:1.6;margin:10px 0;font-weight:600}
.dbtns{display:flex;gap:10px;margin-top:12px}
.dbtns button{flex:1;border:2px solid #dbdbdb;background:#fff;border-radius:10px;padding:12px;font-size:16px;font-weight:800;cursor:pointer;color:#8e8e8e}
.dbtns button.on-si{background:#00a86b;border-color:#00a86b;color:#fff}
.dbtns button.on-no{background:#8e8e8e;border-color:#8e8e8e;color:#fff}
.navg{display:flex;gap:10px;margin:20px 0}
.navg button{flex:1;border:1px solid #dbdbdb;background:#fff;border-radius:12px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;color:#262626}
.navg button.prim{background:#0095f6;border-color:#0095f6;color:#fff}
.navg button:disabled{opacity:.35;cursor:default}
.cplt{width:100%;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;background:#0095f6;color:#fff;margin:8px 0}
.cplt.on{background:#00a86b}
.colwrap{display:flex;gap:12px;flex-wrap:wrap}
.colwrap>div{flex:1;min-width:140px}
.colwrap h4{font-size:13px;margin-bottom:6px;color:#555}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.25s;z-index:50}
#overlay.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:75vh;background:#fff;border-radius:20px 20px 0 0;transform:translateY(100%);transition:.3s;z-index:51;display:flex;flex-direction:column}
#sheet.on{transform:translateY(0)}
#sheet .hd{padding:10px 18px 6px;text-align:center}
#sheet .hd i{display:block;width:40px;height:4px;border-radius:2px;background:#dbdbdb;margin:0 auto}
#sheet h3{font-size:18px;text-align:center;margin:6px 0 2px;color:#262626}
#sheet .vv{font-size:12px;text-align:center;color:#8e8e8e;margin-bottom:8px}
#sheet .bd{overflow-y:auto;padding:4px 20px 26px;font-size:17px;line-height:1.7}
#sheet .bd p{margin-bottom:12px}
#sheet sup{color:#0095f6;font-weight:700;font-size:12px;margin-right:4px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:#262626;color:#fff;border-radius:20px;padding:10px 20px;font-size:14px;opacity:0;transition:.3s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <button onclick="location.href='index.html'">←</button>
  <div class="t" id="hdTitle"></div>
  <button id="btnDone">🤍</button>
</header>

<div class="wrap" id="app"></div>

<div id="overlay" onclick="cerrarSheet()"></div>
<div id="sheet">
  <div class="hd"><i></i></div>
  <h3 id="shRef"></h3>
  <div class="vv" id="shVer"></div>
  <div class="bd" id="shBody"></div>
</div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="data-a.js"></script>
<script src="data-b.js"></script>
<script src="data-c.js"></script>
<script src="data-d.js"></script>

<script>
/* ============ API BÍBLICA (autodetección) ============ */
let API_BASE = null, BIBLE_VERSION = "RVR1960", apiOK = false;

async function discover(){
  if(API_BASE !== null) return;
  const bases = ["", "/fe-de-jesus", "..", "/biblia"];
  for(const b of bases){
    try{
      const r = await fetch(b + "/api/versions");
      if(!r.ok) continue;
      const vs = await r.json();
      API_BASE = b;
      BIBLE_VERSION = vs.find(v => /rvr.*196|1960/i.test(v)) || vs.find(v => /rvr/i.test(v)) || vs[0];
      apiOK = true;
      return;
    }catch(e){}
  }
  API_BASE = "";
}

/* ============ PARSER DE REFERENCIAS ============ */
const LIBROS = [
["Génesis","Gén","Gn","Gen",1],["Éxodo","Exodo","Éxo","Exo",2],["Levítico","Lev",3],["Números","Núm","Nm","Num",4],
["Deuteronomio","Deut","Dt",5],["Josué","Jos",6],["Jueces","Jue",7],["Rut","Rt",8],
["1 Samuel","1 Sam",9],["2 Samuel","2 Sam",10],["1 Reyes","1 Rey",11],["2 Reyes","2 Rey",12],
["1 Crónicas","1 Crón","1 Cro",13],["2 Crónicas","2 Crón","2 Cro",14],["Esdras","Esd",15],["Nehemías","Neh",16],
["Ester","Est",17],["Job",18],["Salmos","Salmo","Sal",19],["Proverbios","Prov",20],
["Eclesiastés","Ecl",21],["Cantares","Cant",22],["Isaías","Isa","Is",23],["Jeremías","Jer",24],
["Lamentaciones","Lam",25],["Ezequiel","Eze",26],["Daniel","Dan",27],["Oseas","Os",28],
["Joel",29],["Amós","Am",30],["Obadías","Obad",31],["Jonás","Jon",32],["Miqueas","Miq",33],
["Nahúm","Nah",34],["Habacuc","Hab",35],["Sofonías","Sof",36],["Hageo","Hag",37],
["Zacarías","Zac",38],["Malaquías","Mal",39],["Mateo","Mt",40],["Marcos","Mr","Mar",41],
["Lucas","Lc","Luc",42],["Juan","Jn",43],["Hechos","Hch","Hech",44],["Romanos","Rom","Ro",45],
["1 Corintios","1 Cor",46],["2 Corintios","2 Cor",47],["Gálatas","Gál","Gal",48],["Efesios","Efes","Ef",49],
["Filipenses","Filip","Fil",50],["Colosenses","Colos","Col",51],["1 Tesalonicenses","1 Tes",52],
["2 Tesalonicenses","2 Tes",53],["1 Timoteo","1 Tim",54],["2 Timoteo","2 Tim",55],["Tito","Tit",56],
["Filemón","Filem",57],["Hebreos","Heb",58],["Santiago","Stg","Sant",59],["1 Pedro","1 Ped",60],
["2 Pedro","2 Ped",61],["1 Juan","1 Jn",62],["2 Juan","2 Jn",63],["3 Juan","3 Jn",64],
["Judas","Jud",65],["Apocalipsis","Apoc","Ap",66]
];

function norm(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim(); }

const reLibros = LIBROS.flatMap(g => g.slice(0,-1))
  .sort((a,b) => b.length - a.length)
  .map(x => x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"))
  .join("|");

const V = "(\\d{1,3}(?:\\s?[-–—]\\s?\\d{1,3}(?::\\d{1,3})?)?(?:\\s?,\\s?\\d{1,3}(?:\\s?[-–—]\\s?\\d{1,3})?)*)";
const REF_RE = new RegExp("(?<![\\p{L}\\p{N}])((?:" + reLibros + ")\\.?\\s?\\d{1,3}(?::\\s?" + V + ")?)", "gu");
const REF_ONE = new RegExp("^(" + reLibros + ")\\.?\\s?(\\d{1,3})(?::\\s?" + V + ")?$","u");

function numeroLibro(nombre){
  const n = norm(nombre.replace(/\.$/,""));
  const g = LIBROS.find(g => g.slice(0,-1).some(a => norm(a) === n));
  return g ? g[g.length-1] : null;
}

function escapeHtml(t){
  return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function linkRefs(texto){
  return escapeHtml(texto).replace(REF_RE, (m, ref) =>
    `<a class="ref" data-r="${ref}">${ref}</a>`);
}

function chips(refs){
  const partes = refs.split(";").map(s => s.trim()).filter(Boolean);
  let libroPrev = "";
  return partes.map(p => {
    const m = p.match(/^([A-Za-zÁÉÍÓÚÜÑáéíóúüñ][^\d]*?)\.?\s?\d/);
    if(m && numeroLibro(m[1])) libroPrev = m[1].replace(/\.$/,"");
    else if(libroPrev) p = libroPrev + " " + p;
    return p;
  });
}

/* ============ BOTTOM SHEET DEL VERSÍCULO ============ */
function parseOne(ref){
  const m = ref.replace(/\s+/g," ").match(REF_ONE);
  if(!m) return null;
  const b = numeroLibro(m[1]);
  if(!b) return null;
  return { b, c: +m[2], versos: m[3] || null };
}

async function fetchCap(b, c){
  const r = await fetch(`${API_BASE}/api/verses?version=${encodeURIComponent(BIBLE_VERSION)}&book=${b}&chapter=${c}`);
  if(!r.ok) throw 0;
  return r.json();
}

async function openRef(ref){
  const p = parseOne(ref);
  if(!p){ return; }
  document.getElementById("shRef").textContent = ref;
  document.getElementById("shVer").textContent = "Cargando…";
  document.getElementById("shBody").innerHTML = "";
  abrirSheet();
  try{
    await discover();
    let caps = [p.c];
    let rango = null;
    if(p.versos){
      const rm = p.versos.match(/^(\d+)\s?[-–—]\s?(\d{1,3})(?::(\d{1,3}))?$/);
      if(rm && rm[2]){
        if(rm[3] !== undefined){ caps = [+p.c, +rm[2]]; rango = { de:+rm[1], hasta:+rm[3], capFin:+rm[2] }; }
        else rango = { de:+p.versos.match(/^\d+/)[0], hasta:+rm[2], capFin:+p.c };
      } else if(p.versos.includes(",")){
        rango = { lista: p.versos.split(",").map(s=>+s.trim()) };
      } else if(p.versos.match(/^\d+\s?[-–—]\s?\d+$/)){
        const [a,z] = p.versos.split(/\s?[-–—]\s?/);
        rango = { de:+a, hasta:+z, capFin:p.c };
      } else if(/^\d+$/.test(p.versos.trim())){
        rango = { lista: [ +p.versos.trim() ] };
      }
    }
    const datos = await Promise.all(caps.map(c => fetchCap(p.b, c)));
    let html = "";
    const pintar = (versos, capN) => {
      let sel = versos;
      if(rango){
        if(rango.lista) sel = versos.filter(v => rango.lista.includes(+v.verse));
        else sel = versos.filter(v => +v.verse >= rango.de && +v.verse <= (capN === rango.capFin ? rango.hasta : 999));
      }
      sel.forEach(v => { html += `<p><sup>${v.verse}</sup>${escapeHtml(v.text)}</p>`; });
    };
    caps.forEach((c,i) => pintar(datos[i], c));
    document.getElementById("shVer").textContent = BIBLE_VERSION + (apiOK ? "" : " · modo sin conexión");
    document.getElementById("shBody").innerHTML = html || "<p>No se encontraron los versículos.</p>";
  }catch(e){
    document.getElementById("shVer").textContent = "";
    document.getElementById("shBody").innerHTML =
      `<p style="color:#8e8e8e">No se pudo cargar el texto bíblico. Verificá la conexión con la API de la Biblia.</p><p><a class="ref" style="pointer-events:none">${ref}</a></p>`;
  }
}

function abrirSheet(){
  document.getElementById("sheet").classList.add("on");
  document.getElementById("overlay").classList.add("on");
}
function cerrarSheet(){
  document.getElementById("sheet").classList.remove("on");
  document.getElementById("overlay").classList.remove("on");
}
document.addEventListener("click", e => {
  const a = e.target.closest("a.ref");
  if(a) openRef(a.dataset.r);
});

/* ============ ESTADO ============ */
const getDone = () => JSON.parse(localStorage.getItem("fej_done") || "{}");
const setDone = o => localStorage.setItem("fej_done", JSON.stringify(o));
const getDecs = () => JSON.parse(localStorage.getItem("fej_dec") || "{}");
const setDecs = o => localStorage.setItem("fej_dec", JSON.stringify(o));

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("on");
  setTimeout(() => t.classList.remove("on"), 2200);
}

/* ============ RENDER ============ */
const params = new URLSearchParams(location.search);
const dia = +params.get("dia") || 1;
const L = LECCIONES.find(x => x.d === dia) || LECCIONES[0];

localStorage.setItem("fej_ultimo", L.d);
document.getElementById("hdTitle").textContent = "Día " + L.d + " de 20";
document.title = "Día " + L.d + " — " + L.t;
document.getElementById("btnDone").onclick = toggleDone;

function renderDone(){
  const hecho = !!getDone()[L.d];
  document.getElementById("btnDone").textContent = hecho ? "❤️" : "🤍";
  const b = document.getElementById("btnCplt");
  if(b){ b.classList.toggle("on", hecho); b.textContent = hecho ? "✓ Estudio completado" : "Marcar estudio como completado"; }
}
function toggleDone(){
  const o = getDone();
  if(o[L.d]){ delete o[L.d]; toast("Estudio desmarcado"); }
  else { o[L.d] = 1; toast("❤️ ¡Estudio " + L.d + " completado!"); }
  setDone(o);
  renderDone();
}

function card(innerHTML, extraClass){ return `<section class="card ${extraClass||""}">${innerHTML}</section>`; }

function egwBlock(citas){
  if(!citas || !citas.length) return "";
  return citas.map(c => `<div class="egw">“${escapeHtml(c.x)}”<b>— ${escapeHtml(c.f)}</b></div>`).join("");
}

function listaHTML(items){
  return `<ul class="lis">${items.map(it =>
    `<li>${linkRefs(it.x)}${it.r ? ` <span style="color:#8e8e8e;font-size:12px">(${it.r})</span>` : ""}</li>`).join("")}</ul>`;
}

function extrasHTML(efs){
  if(!efs) return "";
  return efs.map(e => card(
    `<h2>${e.tt}</h2>` +
    (e.parrafo ? `<div class="des">${linkRefs(e.parrafo)}</div>` : "") +
    (e.columnas ? `<div class="colwrap">` + e.columnas.map(col =>
      `<div><h4>${col.ct}</h4>${listaHTML(col.items)}</div>`).join("") + `</div>` : "") +
    (e.lista ? listaHTML(e.lista) : "") +
    (e.nota ? `<div class="des" style="margin-top:10px;font-size:14px;color:#666">${linkRefs(e.nota)}</div>` : "") +
    egwBlock(e.egw)
  )).join("");
}

function render(){
  const deces = getDecs();
  let h = `
  <div class="hero" style="background:${L.g}">
    <div class="dia">DÍA ${L.d} DE 20</div>
    <div class="em">${L.e}</div>
    <h1>${escapeHtml(L.t)}</h1>
  </div>`;

  if(L.i) h += card(`<h2>📖 Introducción</h2><div class="intro">${linkRefs(L.i)}</div>`);

  if(L.temas) h += L.temas.map(t =>
    card(`<h2>✨ ${escapeHtml(t.tt)}</h2>` +
      t.ps.map(p =>
        `<div class="preg">
           <span class="pnum">${p.n}</span><span class="pq">${escapeHtml(p.p)}</span>
           <div class="chips">${chips(p.r).map(c => `<button class="chip" onclick="openRef('${c.replace(/'/g,"\\'")}')">${escapeHtml(c)}</button>`).join("")}</div>
           <div><span class="resp">✔ ${escapeHtml(p.resp)}</span></div>
           <div class="des">${linkRefs(p.des)}</div>
           ${egwBlock(p.egw)}
         </div>`).join("")
    )).join("");

  h += extrasHTML(L.extras);

  if(L.dec) h += `<section class="dec">
    <h2>✍️ Decisión personal</h2>
    <div class="des" style="margin-top:8px">${linkRefs("Después de haber leído y entendido, mi decisión personal es:")}</div>
    <p>“${escapeHtml(L.dec)}”</p>
    <div class="dbtns">
      <button id="btnSi" class="${deces[L.d] === "si" ? "on-si" : ""}" onclick="decidir('si')">SÍ</button>
      <button id="btnNo" class="${deces[L.d] === "no" ? "on-no" : ""}" onclick="decidir('no')">NO</button>
    </div>
  </section>`;

  if(L.amf) h += card(`<h2>🌅 Alimentando mi fe</h2>` +
    (L.amf.des ? `<div class="des">${linkRefs(L.amf.des)}</div>` : "") +
    (L.amf.pg ? `<div class="des" style="margin-top:8px"><b>Preguntas guía:</b><ul class="lis">${L.amf.pg.map(x=>`<li>${escapeHtml(x)}</li>`).join("")}</ul></div>` : "") +
    (L.amf.dias && L.amf.dias.length ? listaHTML(L.amf.dias.map(d => ({x: d.x + " — " + d.i}))) : ""));

  if(L.fmf){
    const esOps = typeof L.fmf === "object";
    h += card(`<h2>🤝 Fortaleciendo mi fe</h2>` +
      (esOps
        ? `<ol class="lis" style="padding-left:20px">` + L.fmf.ops.map(o => `<li style="list-style:decimal">${escapeHtml(o)}</li>`).join("") + `</ol>`
        : `<div class="des">${linkRefs(L.fmf)}</div>`) +
      egwBlock(esOps ? L.fmf.egw : L.fmf_egw));
  }

  if(L.cmf) h += card(`<h2>📣 Compartiendo mi fe</h2>` +
    (L.cmf.cita ? `<div class="egw">“${escapeHtml(L.cmf.cita.x)}”<b>— ${escapeHtml(L.cmf.cita.f)}</b></div>` : "") +
    listaHTML(L.cmf.act.map(a => ({x:a}))) +
    (L.cmf.preg ? `<div class="des" style="margin-top:10px"><b>${escapeHtml(L.cmf.preg)}</b></div>` : "") +
    egwBlock(L.cmf.egw));

  if(L.res) h += card(`<h2>📌 Resumen</h2><div class="des">${linkRefs(L.res)}</div>` +
    (L.d === 20 ? `<div class="egw" style="text-align:center;font-size:16px"><b style="display:block;margin:0 0 8px">JESÚS VIENE PRONTO 🎉</b>¡Completaste los 20 estudios de Fe de Jesús!</div>` : ""));

  h += `<button class="cplt" id="btnCplt" onclick="toggleDone()"></button>`;

  const ant = LECCIONES.find(x => x.d === L.d - 1);
  const sig = LECCIONES.find(x => x.d === L.d + 1);
  h += `<div class="navg">
    <button ${ant ? "" : "disabled"} onclick="location.href='leccion.html?dia=${L.d-1}'">← Anterior</button>
    <button class="prim" ${sig ? "" : "disabled"} onclick="location.href='leccion.html?dia=${L.d+1}'">Siguiente →</button>
  </div>`;

  document.getElementById("app").innerHTML = h;
  renderDone();
}

function decidir(v){
  const o = getDecs();
  o[L.d] = v;
  setDecs(o);
  document.getElementById("btnSi").className = v === "si" ? "on-si" : "";
  document.getElementById("btnNo").className = v === "no" ? "on-no" : "";
  toast(v === "si" ? "✅ ¡Bendecida decisión!" : "Decisión guardada");
}

render();
discover();
</script>
</body>
</html>
