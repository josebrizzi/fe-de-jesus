<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FeQuiz · Pantalla del proyector</title>
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<style>
/* ============================================================
   FEQUIZ — PANTALLA DE PROYECCIÓN (espejo de la partida)
   Se abre sola con el botón PROYECTAR del anfitrión.
   Solo muestra: no tiene botones de control (se dirige desde
   el celular del anfitrión). Pensada para proyector / TV.
   ============================================================ */
@font-face { font-family: 'Montserrat'; font-style: normal; font-display: swap; font-weight: 100 900;
  src: url('./fuentes/montserrat-variable.woff2') format('woff2-variations'),
       url('./fuentes/montserrat-variable.woff2') format('woff2'); }

:root {
  --morado: #46178F; --morado-osc: #2C0E63; --morado-hondo: #1E0A45;
  --rojo: #E21B3C; --azul: #1368CE; --amarillo: #FFA602; --verde: #26890C;
  --blanco-75: rgba(255,255,255,.78); --blanco-25: rgba(255,255,255,.22);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif;
  color: #fff; overflow: hidden; cursor: default;
  background:
    radial-gradient(130% 100% at 50% 0%, #5B21B6 0%, var(--morado) 50%, var(--morado-osc) 100%);
}
.fondo-fig { position: fixed; inset: 0; z-index: 0; opacity: .055; pointer-events: none; }
.fondo-fig svg { position: absolute; }
.oculto { display: none !important; }

/* ---------- marco general: todo entra en una pantalla ---------- */
#v {
  position: fixed; inset: 0; z-index: 2;
  display: flex; flex-direction: column;
  padding:2.4vh;padding:clamp(10px, 2.4vh, 26px) clamp(14px, 3vw, 48px) calc(clamp(10px, 2.4vh, 26px) + env(safe-area-inset-bottom));
}

/* ---------- esquinas: estado + pantalla completa + aviso ---------- */
.esq { position: fixed; right:1.6vw;right:clamp(8px, 1.6vw, 22px); bottom:1.8vh;bottom:clamp(8px, 1.8vh, 18px); z-index: 6;
  display: flex; align-items: center; gap: 10px; }
.aviso-ctrl { font-size:1.2vh;font-size:clamp(9px, 1.2vh, 13px); font-weight: 600; color: rgba(255,255,255,.5); letter-spacing: .4px; }
.btn-fs {
  border: 0; border-radius: 10px; background: rgba(255,255,255,.12); color: #fff;
  width:4.6vh;width:clamp(34px, 4.6vh, 46px); height:4.6vh;height:clamp(34px, 4.6vh, 46px);
  display: grid; place-items: center; cursor: pointer;
}
.btn-fs:hover { background: rgba(255,255,255,.22); }
.btn-fs svg { width: 55%; height: 55%; }
.estado-red { position: fixed; left:1.6vw;left:clamp(8px, 1.6vw, 22px); bottom:1.8vh;bottom:clamp(8px, 1.8vh, 18px); z-index: 6;
  display: flex; align-items: center; gap: 7px; font-size:1.3vh;font-size:clamp(9px, 1.3vh, 13px); font-weight: 700;
  color: rgba(255,255,255,.55); }
.punto { width: 9px; height: 9px; border-radius: 50%; background: #38E05C; box-shadow: 0 0 8px #38E05C; }
.punto.mal { background: #FF6D7E; box-shadow: 0 0 8px #FF6D7E; animation: late .8s ease-in-out infinite; }

/* ---------- cabecera reutilizable ---------- */
.marca-zona { display: flex; align-items: center; justify-content: center; gap:1.4vw;gap:clamp(8px, 1.4vw, 16px); flex: 0 0 auto; }
.marca-zona .figs { display: grid; grid-template-columns: repeat(2, 1em); gap: .28em; font-size:2.6vh;font-size:clamp(14px, 2.6vh, 24px); }
.marca-zona .figs svg { width: 1em; height: 1em; display: block; }
.marca-zona .nombre { font-weight: 800; letter-spacing: .35em; font-size:3.2vh;font-size:clamp(16px, 3.2vh, 30px); }
.origen { display: flex; align-items: center; justify-content: center; gap: .5em; font-weight: 700;
  color: var(--blanco-75); font-size:2.3vh;font-size:clamp(13px, 2.3vh, 21px); }

/* ============ LOBBY ============ */
.lb { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap:1.4vh;gap:clamp(6px, 1.4vh, 16px); }
.lb .marca-zona { position: absolute; top:2.4vh;top:clamp(10px, 2.4vh, 26px); left: 0; right: 0; }
.pin-caja { background: #fff; border-radius:2.4vh;border-radius:clamp(12px, 2.4vh, 24px); padding:2vh;padding:clamp(10px, 2vh, 22px) clamp(26px, 5vw, 70px) clamp(12px, 2.2vh, 24px);
  text-align: center; box-shadow: 0 clamp(6px, 1.4vh, 14px) 0 rgba(0,0,0,.28); }
.pin-rotulo { font-size:1.8vh;font-size:clamp(11px, 1.8vh, 17px); font-weight: 800; letter-spacing: .35em; color: #9a86c9; }
.pin-numero { font-size:13vh;font-size:clamp(58px, 13vh, 128px); font-weight: 800; letter-spacing: .14em; color: var(--morado);
  line-height: 1.05; font-variant-numeric: tabular-nums; }
.lb-url { font-size:2vh;font-size:clamp(12px, 2vh, 19px); font-weight: 700; color: var(--blanco-75); }
.lb-url b { color: #fff; }
.lb-cuenta { font-size:2.6vh;font-size:clamp(15px, 2.6vh, 25px); font-weight: 700; color: var(--blanco-75); }
.lb-cuenta b { color: var(--amarillo); font-size: 1.35em; }
.chips { display: flex; flex-wrap: wrap; gap:1.2vh;gap:clamp(6px, 1.2vh, 12px); justify-content: center;
  max-width: 92vw; max-height: 34vh; overflow: hidden; }
.chip-j { background: rgba(255,255,255,.14); border:.3vh;border:clamp(1px, .3vh, 2px) solid rgba(255,255,255,.25);
  border-radius: 999px; padding:1.1vh;padding:clamp(5px, 1.1vh, 11px) clamp(12px, 1.8vw, 22px);
  font-size:2.6vh;font-size:clamp(14px, 2.6vh, 25px); font-weight: 700; animation: entra .28s ease-out; }
@keyframes entra { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes late { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.espera { display: flex; gap: 8px; justify-content: center; }
.espera i { width:1.4vh;width:clamp(8px, 1.4vh, 13px); height:1.4vh;height:clamp(8px, 1.4vh, 13px); border-radius: 50%; background: rgba(255,255,255,.7); animation: rebote .9s ease-in-out infinite; }
.espera i:nth-child(2) { animation-delay: .15s; } .espera i:nth-child(3) { animation-delay: .3s; }
@keyframes rebote { 0%, 100% { transform: translateY(0); opacity: .45; } 50% { transform: translateY(-9px); opacity: 1; } }

/* ============ CUENTA ============ */
.ct { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; }
.ct-num { font-size:26vh;font-size:clamp(90px, 26vh, 260px); font-weight: 800; text-shadow: 0 clamp(6px, 1.4vh, 14px) 0 rgba(0,0,0,.3);
  animation: pop .72s ease-out; }
@keyframes pop { from { transform: scale(2.1); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.ct-sub { font-size:2.8vh;font-size:clamp(15px, 2.8vh, 27px); font-weight: 700; color: var(--blanco-75); }

/* ============ PREGUNTA / REVELACIÓN ============ */
.j { flex: 1; min-height: 0; display: flex; flex-direction: column; gap:1.3vh;gap:clamp(6px, 1.3vh, 14px); }
.j-top { display: flex; align-items: center; gap:1.4vw;gap:clamp(8px, 1.4vw, 18px); flex: 0 0 auto; }
.j-chip { background: rgba(0,0,0,.26); border-radius: 999px; padding:.9vh;padding:clamp(4px, .9vh, 9px) clamp(11px, 1.6vw, 20px);
  font-size:2.3vh;font-size:clamp(13px, 2.3vh, 22px); font-weight: 800; letter-spacing: .08em; }
.j-top .spacer { flex: 1; }
.j-timer { width:6.4vh;width:clamp(34px, 6.4vh, 62px); height:6.4vh;height:clamp(34px, 6.4vh, 62px); border-radius: 50%;
  display: grid; place-items: center; background: rgba(255,255,255,.14);
  font-size:3.4vh;font-size:clamp(17px, 3.4vh, 32px); font-weight: 800; font-variant-numeric: tabular-nums; }
.j-timer.apurado { box-shadow: inset 0 0 0 3px var(--amarillo); }
.j-timer.critico { box-shadow: inset 0 0 0 3px var(--rojo); animation: late .5s ease-in-out infinite; }
.j-pista { flex: 0 0 auto; height:1.1vh;height:clamp(6px, 1.1vh, 11px); border-radius: 99px; background: rgba(255,255,255,.18); overflow: hidden; }
.j-barra { height: 100%; width: 100%; border-radius: 99px; background: #fff; }
.j-preg { flex: 0 0 auto; background: #fff; color: #2b2b2b; border-radius:2vh;border-radius:clamp(10px, 2vh, 20px);
  padding:2.2vh;padding:clamp(10px, 2.2vh, 24px) clamp(14px, 2.6vw, 36px);
  font-weight: 800; text-align: center; display: grid; place-items: center;
  font-size:6.4vh;font-size:clamp(35px, 6.4vh, 64px); line-height: 1.22; }
.j-preg.larga { font-size:4.9vh;font-size:clamp(31px, 4.9vh, 50px); }
/* en la revelación la pregunta convive con las pastillas + veredicto:
   va algo más chica para que las RESPUESTAS queden grandes y completas */
.j-preg.en-revel { font-size:4.2vh;font-size:clamp(28px, 4.2vh, 42px); }
.j-preg.en-revel.larga { font-size:3.3vh;font-size:clamp(24px, 3.3vh, 34px); }
.opcs { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
  gap:1.5vh;gap:clamp(7px, 1.5vh, 15px); }
.opc { border-radius:1.8vh;border-radius:clamp(9px, 1.8vh, 18px); display: flex; align-items: center; gap:1.4vw;gap:clamp(8px, 1.4vw, 18px);
  padding:1.6vh;padding:clamp(8px, 1.6vh, 18px) clamp(12px, 2vw, 28px); color: #fff;
  box-shadow: 0 clamp(4px, .9vh, 9px) 0 rgba(0,0,0,.3); overflow: hidden;
  font-size:4.4vh;font-size:clamp(29px, 4.4vh, 45px); font-weight: 700; line-height: 1.2; }
.opc.larga { font-size:3.6vh;font-size:clamp(26px, 3.6vh, 37px); }
.opc .figura { width:4.6vh;width:clamp(26px, 4.6vh, 44px); height:4.6vh;height:clamp(26px, 4.6vh, 44px); flex: 0 0 auto; }
.opc .figura svg { width: 100%; height: 100%; display: block; }
.opc .texto { flex: 1; }
.opc .conteo { align-self: center; background: rgba(0,0,0,.3); border-radius: 999px; padding: .2em .6em;
  font-size: .8em; font-weight: 800; flex: 0 0 auto; }
.opc.r1 { background: var(--rojo); } .opc.r2 { background: var(--azul); }
.opc.r3 { background: var(--amarillo); color: #3d2800; } .opc.r4 { background: var(--verde); }
.revel .opc { opacity: .3; filter: saturate(.55); }
.revel .opc.acierto { opacity: 1; filter: none; box-shadow: 0 0 0 clamp(3px, .6vh, 6px) #fff, 0 clamp(4px, .9vh, 9px) 0 rgba(0,0,0,.3);
  animation: pulso .6s ease-out 2; }
@keyframes pulso { 0% { transform: scale(1); } 50% { transform: scale(1.025); } 100% { transform: scale(1); } }
.revel .opc .palomita { flex: 0 0 auto; width:4.8vh;width:clamp(26px, 4.8vh, 44px); height:4.8vh;height:clamp(26px, 4.8vh, 44px); }
.veredicto { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap:1.2vw;gap:clamp(7px, 1.2vw, 14px);
  font-weight: 800; font-size:4vh;font-size:clamp(24px, 4vh, 40px); color: #7DDB6A; }
.veredicto svg { width:4.2vh;width:clamp(24px, 4.2vh, 40px); height:4.2vh;height:clamp(24px, 4.2vh, 40px); flex: 0 0 auto; }
.versiculo { flex: 0 0 auto; text-align: center; font-weight: 700; color: var(--amarillo);
  font-size:3.2vh;font-size:clamp(20px, 3.2vh, 31px); }
.revel-zona { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 1.35fr 1fr; gap:1.6vw;gap:clamp(8px, 1.6vw, 20px); }
.revel-izq { min-height: 0; display: flex; flex-direction: column; gap:1.2vh;gap:clamp(6px, 1.2vh, 13px); }
.revel-der { min-height: 0; display: flex; flex-direction: column; gap:1vh;gap:clamp(5px, 1vh, 10px); }
.top-tit { font-size:2.5vh;font-size:clamp(14px, 2.5vh, 24px); font-weight: 800; letter-spacing: .2em; color: var(--blanco-75); }
.top-f { display: flex; align-items: center; gap:1.1vw;gap:clamp(7px, 1.1vw, 15px); background: rgba(0,0,0,.22);
  border-radius:1.5vh;border-radius:clamp(8px, 1.5vh, 14px); padding:1vh;padding:clamp(5px, 1vh, 11px) clamp(10px, 1.4vw, 18px);
  font-size:2.9vh;font-size:clamp(15px, 2.9vh, 28px); font-weight: 700; }
.top-f.primero { background: rgba(255,166,2,.2); box-shadow: inset 0 0 0 2px rgba(255,166,2,.55); }
.top-f .pos { flex: 0 0 auto; width: 1.7em; text-align: center; }
.top-f .apo { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-f .pts { font-weight: 800; color: var(--amarillo); font-variant-numeric: tabular-nums; }

/* ============ PODIO ============ */
.pd { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap:1vh;gap:clamp(4px, 1vh, 12px); }
.pd-saludo { font-size:4.6vh;font-size:clamp(20px, 4.6vh, 44px); font-weight: 800; letter-spacing: .06em; text-shadow: 0 4px 0 rgba(0,0,0,.25); }
.pd-rotulo { font-size:2vh;font-size:clamp(11px, 2vh, 19px); font-weight: 800; letter-spacing: .5em; color: var(--blanco-75); }
.pd-zona { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 1fr 1.1fr; gap:2vw;gap:clamp(10px, 2vw, 30px);
  width: 100%; align-items: center; }
.pd-barras { display: flex; align-items: flex-end; justify-content: center; gap:1.6vw;gap:clamp(8px, 1.6vw, 24px); height: 100%; max-height: 52vh; }
.pd-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 1vh; height: 100%; }
.pd-medalla { font-size:6vh;font-size:clamp(24px, 6vh, 58px); }
.pd-apodo { font-weight: 800; font-size:2.6vh;font-size:clamp(13px, 2.6vh, 26px); max-width: 16vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pd-pts { font-weight: 800; color: var(--amarillo); font-size:2.1vh;font-size:clamp(11px, 2.1vh, 21px); font-variant-numeric: tabular-nums; }
.pd-barra { width:8.4vw;width:clamp(46px, 8.4vw, 130px); border-radius:1.5vh;border-radius:clamp(8px, 1.5vh, 14px) clamp(8px, 1.5vh, 14px) 0 0;
  background: rgba(255,255,255,.85); box-shadow: 0 0 0 clamp(2px, .5vh, 5px) rgba(0,0,0,.15); }
.pd-barra.b0 { height: 100%; background: #FFD54D; }
.pd-barra.b1 { height: 68%; background: #D9D9D9; }
.pd-barra.b2 { height: 50%; background: #E0A26B; }
.pd-lista { align-self: center; max-height: 52vh; overflow-y: auto; display: flex; flex-direction: column; gap:.9vh;gap:clamp(4px, .9vh, 9px); }

/* ============ mensajes fijos ============ */
.ms { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 2vh; padding: 0 6vw; }
.ms h1 { font-size:4.4vh;font-size:clamp(20px, 4.4vh, 42px); font-weight: 800; }
.ms p { font-size:2.4vh;font-size:clamp(13px, 2.4vh, 23px); font-weight: 600; color: var(--blanco-75); line-height: 1.5; }
.ms .mini { font-size:1.9vh;font-size:clamp(11px, 1.9vh, 17px); }
.ms .err { color: #FF9AA5; font-weight: 800; }

/* ---------- pantalla de conexión (proyector sin enlace) ---------- */
.entrada { display: flex; flex-direction: column; align-items: center; gap:2vh;gap:clamp(10px, 2vh, 20px); }
.entrada input { background: #fff; color: var(--morado); border: 0; border-radius:2vh;border-radius:clamp(10px, 2vh, 18px);
  width: min(76vw, 430px); padding:2.4vh;padding:clamp(10px, 2.4vh, 24px) clamp(14px, 3vw, 30px);
  font-family: inherit; font-weight: 800; font-size:7.5vh;font-size:clamp(30px, 7.5vh, 68px);
  letter-spacing: .14em; text-align: center; font-variant-numeric: tabular-nums; outline: none;
  box-shadow: 0 clamp(5px, 1.2vh, 12px) 0 rgba(0,0,0,.28); }
.entrada input::placeholder { color: #C9BDE6; letter-spacing: .2em; }
#btn-ir { border: 0; cursor: pointer; border-radius: 999px; background: var(--verde); color: #fff;
  font-family: inherit; font-weight: 800; font-size:2.6vh;font-size:clamp(14px, 2.6vh, 24px); letter-spacing: .12em;
  padding:2vh;padding:clamp(10px, 2vh, 20px) clamp(26px, 5.5vw, 64px);
  box-shadow: 0 clamp(4px, .9vh, 9px) 0 rgba(0,0,0,.3); }
#btn-ir:active { transform: translateY(2px); }
/* teclado en pantalla: para Smart TV con control remoto (y también con mouse) */
.teclado { display: flex; flex-wrap: wrap; justify-content: space-between;
  width: min(64vw, 40vh, 380px); margin-top: -1vh; }
.teclas { width: 31%; margin-top: 1.6vh; border: 0; cursor: pointer; font-family: inherit;
  font-weight: 800; font-size:4vh;font-size:clamp(18px, 4vh, 36px); color: #fff;
  background: rgba(255,255,255,.14); border-radius:1.6vh;border-radius:clamp(9px, 1.6vh, 16px);
  padding:1.2vh;padding:clamp(7px, 1.2vh, 13px) 0; box-shadow: 0 clamp(3px, .7vh, 7px) 0 rgba(0,0,0,.22); }
.teclas:active, .teclas:focus { background: rgba(255,255,255,.34); outline: 3px solid rgba(255,255,255,.9); outline-offset: 2px; }
.teclas.borrar { background: rgba(226,27,60,.34); }
.relleno { width: 30%; visibility: hidden; }
.btn-otra { border: 0; cursor: pointer; border-radius: 999px; background: rgba(255,255,255,.12); color: #fff;
  font-family: inherit; font-weight: 800; font-size:2.3vh;font-size:clamp(12px, 2.3vh, 21px); letter-spacing: .1em;
  padding:1.8vh;padding:clamp(9px, 1.8vh, 18px) clamp(20px, 4vw, 46px);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.55); margin-top: 1vh; }
.btn-otra:active { transform: translateY(2px); }
/* botón SIGUIENTE del anfitrión en la revelación (solo si esta pantalla
   tiene permiso, o sea que se abrió desde el celular del anfitrión) */
.btn-avanzar { border: 0; cursor: pointer; border-radius: 999px; background: var(--verde); color: #fff;
  font-family: inherit; font-weight: 800; font-size:3.6vh;font-size:clamp(18px, 3.6vh, 34px); letter-spacing: .08em;
  padding:2.2vh;padding:clamp(10px, 2.2vh, 22px) clamp(24px, 4.5vw, 54px);
  box-shadow: 0 clamp(4px, .9vh, 9px) 0 rgba(0,0,0,.3); align-self: center; margin-top: 1.4vh;margin-top:clamp(7px, 1.4vh, 14px); }
.btn-avanzar:active { transform: translateY(2px); }
.btn-avanzar[disabled] { opacity: .55; }
.aviso-avanzar { margin-top:auto; text-align:center; font-weight: 700; color: var(--blanco-75);
  font-size:2.3vh;font-size:clamp(13px, 2.3vh, 21px); line-height: 1.45; padding: 0 1vw;
  padding-bottom:5.5vh;padding-bottom:clamp(26px, 5.5vh, 52px); }
#confeti { position: fixed; inset: 0; z-index: 5; pointer-events: none; }

/* Portrait (celular en vertical): la grilla de opciones pasa a 1 columna
   y la revelación apila sus zonas */
@media (max-aspect-ratio: 5/6) {
  .opcs { grid-template-columns: 1fr; grid-template-rows: repeat(4, 1fr); }
  .revel-zona { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
  .pd-zona { grid-template-columns: 1fr; }
  .pd-barras { max-height: 26vh; }
  .pd-lista { max-height: 22vh; width: 100%; }
}

/* pantallas bajitas (TV chica / notebook en diagonal): achica el teclado */
@media (max-height: 460px) {
  .teclas { font-size:4.6vh;font-size:clamp(14px, 4.6vh, 22px); padding:1.6vh;padding:clamp(4px, 1.6vh, 8px) 0; margin-top: 1.2vh; }
  .entrada input { font-size:9vh;font-size:clamp(22px, 9vh, 40px); }
}
</style>
</head>
<body>

<div class="fondo-fig" aria-hidden="true">
  <svg style="top:-10%;left:-8%;width:44vmin;height:44vmin" viewBox="0 0 100 100"><polygon points="50,6 96,94 4,94" fill="#fff"/></svg>
  <svg style="top:30%;right:-12%;width:36vmin;height:36vmin" viewBox="0 0 100 100"><polygon points="50,2 98,50 50,98 2,50" fill="#fff"/></svg>
  <svg style="bottom:-16%;left:10%;width:50vmin;height:50vmin" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#fff"/></svg>
  <svg style="top:12%;right:16%;width:18vmin;height:18vmin" viewBox="0 0 100 100"><rect x="6" y="6" width="88" height="88" rx="10" fill="#fff"/></svg>
</div>

<div id="v"><div class="ms"><h1>Conectando con la sala…</h1><p>PIN <b id="m-pin">—</b></p></div></div>

  <button class="btn-fs" id="btn-fs" title="Pantalla completa" aria-label="Pantalla completa">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>

<canvas id="confeti" aria-hidden="true"></canvas>

<script>
(function () {
  'use strict';

  /* ---------- parámetros ----------
     se leen a mano (sin URLSearchParams) para que funcione también
     en navegadores viejos, como el de muchas PCs de proyector */
  function leerUrl() {
    var s = {};
    var partes = String(location.search || '').replace(/^\?/, '').split('&');
    for (var i = 0; i < partes.length; i++) {
      if (!partes[i]) continue;
      var kv = partes[i].split('=');
      try {
        s[decodeURIComponent(kv[0] || '')] = decodeURIComponent(String(kv[1] || '').replace(/\+/g, ' '));
      } catch (e) { /* parte rara: se ignora */ }
    }
    return s;
  }
  var qs = leerUrl();
  var PIN = String(qs.pin || '').replace(/\D/g, '').slice(0, 6);
  var TOKEN = String(qs.token || '');
  var CLAVE_PROY = 'fequiz_proy';
  document.getElementById('m-pin').textContent = PIN || '—';

  var V = document.getElementById('v');
  var estadoRed = document.getElementById('estado-red');

  var FIG = [
    '<svg viewBox="0 0 20 20"><polygon points="10,2 18.5,18 1.5,18" fill="#fff"/></svg>',
    '<svg viewBox="0 0 20 20"><polygon points="10,1 19,10 10,19 1,10" fill="#fff"/></svg>',
    '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.5" fill="#fff"/></svg>',
    '<svg viewBox="0 0 20 20"><rect x="2" y="2" width="16" height="16" rx="2.5" fill="#fff"/></svg>'
  ];
  var PALOMITA = '<svg class="palomita" viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var MEDALLAS = ['🥇', '🥈', '🥉'];
  var FIGURAS_MARCA = '<span class="figs" aria-hidden="true">' +
    '<svg viewBox="0 0 20 20"><polygon points="10,2 18,18 2,18" fill="#E21B3C"/></svg>' +
    '<svg viewBox="0 0 20 20"><polygon points="10,1 19,10 10,19 1,10" fill="#1368CE"/></svg>' +
    '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#FFA602"/></svg>' +
    '<svg viewBox="0 0 20 20"><rect x="2" y="2" width="16" height="16" rx="2.5" fill="#26890C"/></svg></span>';

  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var fmt = function (n) { return Number(n || 0).toLocaleString('es-AR'); };
  /* Recorta textos largos (respuestas) para que entren en la pastilla.
     Corta por espacio y agrega "…". Compatible con navegadores viejos. */
  var recortar = function (t, max) {
    t = String(t == null ? '' : t);
    if (t.length <= max) return t;
    var c = t.slice(0, max - 1);
    var esp = c.lastIndexOf(' ');
    if (esp > max * 0.5) c = c.slice(0, esp);
    return c.replace(/[,;:.!\s]+$/, '') + '\u2026';
  };

  var G = { ult: null, offset: 0, clave: '', vivo: true, cerrada: false, raf: 0, podioConfeti: false, conectado: false, auto: false };

  /* ---------- SONIDO estilo Kahoot (generado por código, sin archivos) ----------
     Todos los sonidos se fabrican con osciladores de Web Audio, así no hay
     que subir ningún mp3. Si el navegador no soporta audio, todo queda mudo
     y la pantalla sigue funcionando igual. */
  var SON_ON = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#fff"/><path d="M16.5 8.5a5 5 0 0 1 0 7M18.8 6.2a8.6 8.6 0 0 1 0 11.6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>';
  var SON_OFF = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#fff"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>';
  var SND = { ctx: null, on: true, intervalo: 0 };

  function sndCtx() {
    if (!SND.ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { SND.ctx = new AC(); } catch (e) { return null; }
    }
    if (SND.ctx.state === 'suspended' && SND.ctx.resume) { try { SND.ctx.resume(); } catch (e) {} }
    return SND.ctx;
  }
  /* Solo se emite si el contexto está corriendo (los navegadores exigen
     una interacción del usuario antes de permitir sonido). */
  function suena() {
    if (!SND.on) return false;
    var c = sndCtx();
    return !!(c && c.state === 'running');
  }
  function tono(freq, dur, tipo, vol, cuando, freqFin) {
    if (!suena()) return;
    var c = SND.ctx;
    var t = c.currentTime + (cuando || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = tipo || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (freqFin) { try { o.frequency.exponentialRampToValueAtTime(freqFin, t + dur); } catch (e) {} }
    g.gain.setValueAtTime(0.0001, t);
    try {
      g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    } catch (e) {}
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.08);
  }

  /* Sonido de platillos / subidas: ruido blanco con caída (sin archivos) */
  function ruido(dur, vol, cuando) {
    if (!suena()) return;
    var c = SND.ctx;
    var t = c.currentTime + (cuando || 0);
    var n = Math.max(1, Math.floor(c.sampleRate * dur));
    var buf = c.createBuffer(1, n, c.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < n; i++) { data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 1.6); }
    var src = c.createBufferSource(); src.buffer = buf;
    var g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    try { g.gain.exponentialRampToValueAtTime(0.0001, t + dur); } catch (e) {}
    src.connect(g); g.connect(c.destination);
    src.start(t); src.stop(t + dur + 0.05);
  }

  /* música de la sala: loop largo y continuo (2 compases) con base,
     melodía y colchón de fondo, para que la espera no se sienta vacía */
  var LOBBY_MEL = [523.25, 659.25, 783.99, 880, 0, 783.99, 659.25, 587.33,
                   523.25, 587.33, 659.25, 783.99, 659.25, 0, 523.25, 0];
  var LOBBY_BAJO = [130.81, 130.81, 98, 98, 110, 110, 98, 98,
                    130.81, 130.81, 87.31, 87.31, 98, 98, 123.47, 123.47];
  function sndLobby() {
    if (SND.intervalo || !suena()) return;
    var barrita = function () {
      for (var i = 0; i < 16; i++) {
        var t = i * 0.26;
        if (LOBBY_MEL[i]) { tono(LOBBY_MEL[i], .15, 'square', .05, t); tono(LOBBY_MEL[i] * 2, .12, 'sine', .018, t); }
        tono(LOBBY_BAJO[i], .22, 'triangle', .09, t);
        if (i % 2 === 1) tono(3000, .03, 'square', .016, t);
      }
      tono(261.63, 2.0, 'sine', .028, 0);
      tono(329.63, 2.0, 'sine', .022, 0);
      tono(392, 2.0, 'sine', .022, 0);
    };
    barrita();
    SND.intervalo = setInterval(function () { if (SND.on) barrita(); }, 4160);
  }
  function sndPararLobby() {
    if (SND.intervalo) { clearInterval(SND.intervalo); SND.intervalo = 0; }
  }

  function sndTic() { tono(1244.5, .07, 'square', .12); }
  function sndYa() { tono(523.25, .3, 'square', .18, 0, 1046.5); ruido(.35, .07, 0); }

  /* PREGUNTA: golpe épico + latido de tensión CONTINUO mientras dura */
  function sndPregunta() {
    sndPararLobby();
    if (!suena()) return;
    tono(130, .5, 'sine', .5, 0, 38);            /* bombo profundo */
    ruido(.55, .16, 0);                           /* crash */
    tono(73.42, .95, 'sawtooth', .1, .02);        /* D2 grave sostenido */
    tono(146.83, .95, 'sawtooth', .07, .02);
    tono(220, .8, 'triangle', .08, .25);
    tono(587.33, .6, 'triangle', .05, .55, 1174); /* subida tensa */
    var paso = 0;
    SND.intervalo = setInterval(function () {     /* corazón: bum-bum… */
      if (!SND.on || !suena()) return;
      tono(73.42, .3, 'sawtooth', .1, 0);
      tono(73.42, .25, 'sawtooth', .08, .35);
      tono(2600, .04, 'square', .018, .7);
      if (paso % 4 === 3) { tono(196, .2, 'sine', .12, 1.05, 120); ruido(.25, .05, 1.05); }
      paso++;
    }, 1400);
  }

  /* REVELACIÓN: subida + acorde triunfal largo (tiempo de explicar) */
  function sndRevela() {
    sndPararLobby();
    if (!suena()) return;
    ruido(.7, .1, 0);
    tono(300, .7, 'triangle', .06, 0, 900);
    tono(523.25, .14, 'triangle', .18, .35);
    tono(659.25, .14, 'triangle', .18, .45);
    tono(783.99, .14, 'triangle', .18, .55);
    tono(1046.5, 1.1, 'triangle', .2, .68);
    tono(1318.5, 1.1, 'triangle', .12, .68);
    tono(1567.98, 1.0, 'sine', .08, .72);
    tono(261.63, 1.1, 'triangle', .1, .68);
    tono(2093, .3, 'sine', .05, 1.15);
  }

  /* PODIO: fanfarria épica de 4 compases con crash */
  function sndFanfarria() {
    sndPararLobby();
    if (!suena()) return;
    ruido(.6, .14, 0);
    tono(392, .18, 'sawtooth', .12, .05);
    tono(523.25, .18, 'sawtooth', .12, .25);
    tono(659.25, .18, 'sawtooth', .12, .45);
    tono(783.99, .5, 'sawtooth', .14, .65);
    tono(1046.5, .5, 'sawtooth', .09, .65);
    tono(261.63, .55, 'triangle', .12, .65);
    tono(523.25, .18, 'sawtooth', .12, 1.25);
    tono(659.25, .18, 'sawtooth', .12, 1.45);
    tono(783.99, .18, 'sawtooth', .12, 1.65);
    tono(1046.5, 1.5, 'sawtooth', .14, 1.85);
    tono(1318.5, 1.4, 'sawtooth', .08, 1.85);
    tono(523.25, 1.5, 'triangle', .12, 1.85);
    tono(261.63, 1.5, 'triangle', .1, 1.85);
    ruido(.9, .1, 1.85);
    tono(2093, .5, 'sine', .05, 2.4);
  }

  function sndPinta() {
    var b = document.getElementById('btn-son');
    if (b) b.innerHTML = SND.on ? SON_ON : SON_OFF;
  }
  /* El navegador solo deja sonar después de que alguien toca la página:
     la primera tecla o clic "despierta" el audio y arranca la música si
     estamos en la sala de espera. */
  function sndDespertar() {
    if (!SND.on) return;
    var c = sndCtx();
    if (c && c.state === 'running' && !SND.intervalo && G.ult && G.ult.estado === 'lobby') sndLobby();
  }

  /* el chip "PIN —" del mensaje inicial puede ya no estar en el DOM
     (se reemplaza al cambiar de vista): siempre de forma protegida */
  function ponerPin(texto) {
    var el = document.getElementById('m-pin');
    if (el) el.textContent = texto;
  }

  /* ---------- PIN guardado (para reconectar si se refresca la pantalla) ---------- */
  function recordar(pin) { try { localStorage.setItem(CLAVE_PROY, JSON.stringify({ pin: pin, t: Date.now() })); } catch (e) {} }
  function olvidar() { try { localStorage.removeItem(CLAVE_PROY); } catch (e) {} }

  /* ---------- pantalla de conexión: escribir el código ---------- */
  function pantallaEntrada(mensaje) {
    sndPararLobby();
    G.cerrada = false;
    G.conectado = false;
    G.ult = null;
    G.podioConfeti = false;
    PIN = ''; TOKEN = '';
    ponerPin('—');
    V.innerHTML = '<div class="ms"><h1>PANTALLA DEL PROYECTOR</h1>' +
      '<p>Escribí el código de la partida:<br>el que muestra el celular del anfitrión</p>' +
      '<div class="entrada">' +
        '<input id="in-pin" inputmode="numeric" maxlength="6" autocomplete="off" autocapitalize="off" placeholder="······">' +
        '<div class="teclado">' +
          '<button class="teclas" type="button">1</button>' +
          '<button class="teclas" type="button">2</button>' +
          '<button class="teclas" type="button">3</button>' +
          '<button class="teclas" type="button">4</button>' +
          '<button class="teclas" type="button">5</button>' +
          '<button class="teclas" type="button">6</button>' +
          '<button class="teclas" type="button">7</button>' +
          '<button class="teclas" type="button">8</button>' +
          '<button class="teclas" type="button">9</button>' +
          '<button class="teclas borrar" type="button">&lt;-</button>' +
          '<button class="teclas" type="button">0</button>' +
          '<span class="relleno"></span>' +
        '</div>' +
        '<button id="btn-ir">CONECTAR</button>' +
      '</div>' +
      (mensaje ? '<p class="err">' + esc(mensaje) + '</p>'
               : '<p class="mini">En el celular del anfitrión: FeQuiz → MODO GRUPAL → DIRIGIR PARTIDA</p>') +
      '</div>';
    var inp = document.getElementById('in-pin'), btn = document.getElementById('btn-ir');
    inp.addEventListener('input', function () { inp.value = inp.value.replace(/\D/g, '').slice(0, 6); });
    function ir() {
      var v = inp.value.replace(/\D/g, '');
      if (v.length !== 6) { pantallaEntrada('El código tiene 6 números'); return; }
      PIN = v; TOKEN = '';
      recordar(PIN);
      ponerPin(PIN);
      V.innerHTML = '<div class="ms"><h1>Conectando con la sala…</h1>' +
        '<p>PIN <b>' + esc(PIN.slice(0, 3)) + ' ' + esc(PIN.slice(3)) + '</b></p>' +
        '<p class="mini">Si tarda un poco, es que el servidor se está despertando</p></div>';
    }
    btn.addEventListener('click', ir);
    inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') ir(); });
    /* teclado en pantalla: para el control remoto del TV (y también con mouse) */
    var teclas = document.querySelectorAll('.teclas');
    function pulsoTecla() {
      if (this.className.indexOf('borrar') >= 0) inp.value = inp.value.slice(0, -1);
      else if (inp.value.length < 6) inp.value += this.textContent;
      if (window.matchMedia && window.matchMedia('(pointer: fine)').matches) inp.focus();
      if (inp.value.length === 6) ir();   /* con 6 dígitos conecta sola */
    }
    for (var i = 0; i < teclas.length; i++) teclas[i].addEventListener('click', pulsoTecla);
    /* en PC se enfoca la casilla para escribir con el teclado;
       en TV no se enfoca, para que no se abra el teclado del televisor */
    try {
      if (window.matchMedia && window.matchMedia('(pointer: fine)').matches) {
        setTimeout(function () { inp.focus(); }, 60);
      }
    } catch (e) {}
  }

  /* ---------- pedir al servidor ----------
     usa fetch si existe y, si no, XHR: así funciona también en
     navegadores viejos que no tienen fetch (Chrome antes de 2015) */
  function pedir(url, cb) {
    if (window.fetch) {
      fetch(url).then(function (r) { return r.json(); }).then(
        function (d) { cb(d); },
        function () { cb(null); }
      );
    } else {
      try {
        var x = new XMLHttpRequest();
        x.open('GET', url, true);
        x.onreadystatechange = function () {
          if (x.readyState !== 4) return;
          var d = null;
          try { d = JSON.parse(x.responseText); } catch (e) {}
          cb(d);
        };
        x.send();
      } catch (e) { cb(null); }
    }
  }

  /* ---------- mandar una orden al servidor (POST) ----------
     Igual que pedir(): fetch si existe, XHR si no. La usa el botón
     SIGUIENTE cuando esta pantalla tiene el permiso del anfitrión. */
  function mandar(ruta) {
    var url = '/api/fequiz/' + ruta;
    var cuerpo = JSON.stringify({ pin: PIN, token: TOKEN });
    if (window.fetch) {
      fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: cuerpo })
        .catch(function () {});
    } else {
      try {
        var x = new XMLHttpRequest();
        x.open('POST', url, true);
        x.setRequestHeader('Content-Type', 'application/json');
        x.send(cuerpo);
      } catch (e) {}
    }
  }

  /* ---------- sondeo ---------- */
  function sondear() {
    if (G.cerrada || !PIN) return;
    var url = '/api/fequiz/estado?pin=' + encodeURIComponent(PIN) +
      (TOKEN ? '&token=' + encodeURIComponent(TOKEN) : '');
    pedir(url, function (d) {
      if (!d || d.ok === false) {
        if (d && d.error === 'no-pin') {
          if (G.conectado) { salaCerrada(); }
          else { olvidar(); pantallaEntrada(G.auto ? 'La sala anterior ya no está. Escribí el código nuevo.' : 'Ese código no existe. Revisalo.'); }
          return;
        }
        G.vivo = false;
        estadoRed.classList.remove('oculto');
        return;
      }
      G.conectado = true; G.auto = false;
      G.vivo = true; estadoRed.classList.add('oculto');
      G.ult = d;
      G.offset = d.servidorAhora - Date.now();
      pintar(d);
    });
  }
  function salaCerrada() {
    G.cerrada = true;
    sndPararLobby();
    olvidar();
    V.innerHTML = '<div class="ms"><h1>LA SALA SE CERRÓ</h1>' +
      '<p>La partida terminó o el anfitrión la cerró.</p>' +
      '<button class="btn-otra" id="btn-otra">CONECTAR A OTRA SALA</button></div>';
    document.getElementById('btn-otra').addEventListener('click', function () {
      pantallaEntrada();
    });
  }

  /* ---------- ciclo visual (timer + cuenta) ---------- */
  function ahoraServ() { return Date.now() + G.offset; }
  function ciclo() {
    var d = G.ult;
    if (d && G.vivo) {
      if (d.estado === 'pregunta') {
        var barra = document.getElementById('j-barra'), num = document.getElementById('j-timer');
        if (barra && d.preguntaHasta) {
          var rest = Math.max(0, d.preguntaHasta - ahoraServ());
          barra.style.width = (rest / (d.segs * 1000) * 100) + '%';
          var seg = Math.ceil(rest / 1000);
          if (num) {
            num.textContent = seg;
            num.classList.toggle('apurado', seg <= 10 && seg > 5);
            num.classList.toggle('critico', seg <= 5);
          }
        }
      } else if (d.estado === 'cuenta') {
        var n = document.getElementById('ct-num');
        if (n && d.cuentaHasta) {
          var rest2 = Math.max(0, d.cuentaHasta - ahoraServ());
          var paso = rest2 > 2400 ? '3' : rest2 > 1400 ? '2' : rest2 > 400 ? '1' : '¡YA!';
          if (n.textContent !== paso) { n.textContent = paso; n.style.animation = 'none'; void n.offsetWidth; n.style.animation = '';
            if (paso === '¡YA!') sndYa(); else sndTic();
          }
        }
      }
    }
    G.raf = requestAnimationFrame(ciclo);
  }

  /* ---------- pintado por estado ---------- */
  function pintar(d) {
    var huellaJug = (d.jugadores || []).map(function (j) { return j.apodo; }).join(',');
    var clave = [d.estado, d.idx, d.activos, d.respondieron, huellaJug, d.total].join('|');
    if (clave === G.clave) return;
    G.clave = clave;

    /* sonidos: solo cuando cambia de pantalla o de pregunta de verdad
       (las repeticiones del sondeo no vuelven a sonar) */
    var prevEst = G.sndEst || '';
    var prevIdx = (typeof G.sndIdx === 'number') ? G.sndIdx : -1;
    if (d.estado !== prevEst) {
      if (d.estado === 'lobby') { sndLobby(); } else { sndPararLobby(); }
      if (d.estado === 'pregunta') sndPregunta();
      else if (d.estado === 'revelacion') sndRevela();
      else if (d.estado === 'podio') sndFanfarria();
    } else if (d.estado === 'pregunta' && d.idx !== prevIdx) {
      sndPregunta();
    } else if (d.estado === 'revelacion' && d.idx !== prevIdx) {
      sndRevela();
    }
    G.sndEst = d.estado; G.sndIdx = d.idx;

    if (d.estado === 'lobby') vLobby(d);
    else if (d.estado === 'cuenta') vCuenta(d);
    else if (d.estado === 'pregunta') vPregunta(d);
    else if (d.estado === 'revelacion') vRevelacion(d);
    else if (d.estado === 'podio') vPodio(d);
  }

  function marca(titulo, icono) {
    return '<div class="marca-zona">' + FIGURAS_MARCA + '<span class="nombre">FEQUIZ</span></div>' +
      (titulo ? '<div class="origen" style="margin-top:.6vh;margin-top:clamp(2px, .6vh, 8px)">' +
        '<span>' + esc(icono || '🎮') + '</span><span>' + esc(titulo) + '</span></div>' : '');
  }

  function vLobby(d) {
    var url = location.protocol + '//' + location.host + '/fequiz/';
    var chips = (d.jugadores || []).map(function (j) { return '<span class="chip-j">' + esc(j.apodo) + '</span>'; }).join('');
    V.innerHTML = marca() +
      '<div class="lb">' +
        '<div class="pin-caja"><div class="pin-rotulo">CÓDIGO DE LA PARTIDA</div>' +
        '<div class="pin-numero">' + esc(String(d.pin).slice(0, 3)) + ' ' + esc(String(d.pin).slice(3)) + '</div></div>' +
        '<div class="lb-url">Sumate desde tu celular en <b>' + esc(url.replace(/^https?:\/\//, '')) + '</b> → UNIRSE CON PIN</div>' +
        '<div class="lb-cuenta"><b>' + d.activos + '</b> ' + (d.activos === 1 ? 'jugador esperando' : 'jugadores esperando') + '</div>' +
        (chips ? '<div class="chips">' + chips + '</div>' : '<div class="espera"><i></i><i></i><i></i></div>') +
      '</div>';
  }

  function vCuenta(d) {
    V.innerHTML = marca() + '<div class="ct">' +
      '<div class="origen"><span>' + esc(d.icono) + '</span><span>' + esc(d.titulo) + '</span></div>' +
      '<div class="ct-num" id="ct-num">3</div>' +
      '<div class="ct-sub">Preparen los celulares…</div></div>';
  }

  function opcionesHtml(q, esRevelacion) {
    var conteos = esRevelacion && q.conteos;
    var maxTxt = 0;
    q.opciones.forEach(function (t) { maxTxt = Math.max(maxTxt, String(t).length); });
    var clsLarga = maxTxt > 38 ? ' larga' : '';
    return '<div class="opcs">' + q.opciones.map(function (t, i) {
      var acierto = esRevelacion && i === q.correctaIdx;
      return '<div class="opc r' + (i + 1) + clsLarga + (acierto ? ' acierto' : '') + '">' +
        '<span class="figura">' + FIG[i] + '</span>' +
        '<span class="texto">' + esc(recortar(t, esRevelacion ? 45 : 60)) + '</span>' +
        (esRevelacion && acierto ? PALOMITA : '') +
        (conteos && conteos[i] ? '<span class="conteo">' + conteos[i] + '</span>' : '') +
        '</div>';
    }).join('') + '</div>';
  }

  function vPregunta(d) {
    var q = d.pregunta;
    V.innerHTML = marca(d.titulo, d.icono) +
      '<div class="j">' +
        '<div class="j-top">' +
          '<span class="j-chip">PREGUNTA ' + (d.idx + 1) + ' DE ' + d.total + '</span>' +
          '<span class="spacer"></span>' +
          '<span class="j-chip" id="j-resp">Respondieron ' + d.respondieron + '/' + d.activos + '</span>' +
          '<span class="j-timer" id="j-timer">' + d.segs + '</span>' +
        '</div>' +
        '<div class="j-pista"><div class="j-barra" id="j-barra"></div></div>' +
        '<div class="j-preg' + (q.p.length > 110 ? ' larga' : '') + '">' + esc(q.p) + '</div>' +
        opcionesHtml(q, false) +
      '</div>';
  }

  function vRevelacion(d) {
    var q = d.revelacion;
    var top = (d.top || []).map(function (j, i) {
      return '<div class="top-f' + (i === 0 ? ' primero' : '') + '">' +
        '<span class="pos">' + (i < 3 ? MEDALLAS[i] : (i + 1) + '°') + '</span>' +
        '<span class="apo">' + esc(j.apodo) + '</span>' +
        '<span class="pts">' + fmt(j.puntos) + '</span></div>';
    }).join('');
    V.innerHTML = marca(d.titulo, d.icono) +
      '<div class="j revel">' +
        '<div class="j-top"><span class="j-chip">PREGUNTA ' + (d.idx + 1) + ' DE ' + d.total + '</span>' +
        '<span class="spacer"></span><span class="j-chip">Respondieron ' + d.respondieron + '/' + d.activos + '</span></div>' +
        '<div class="revel-zona">' +
          '<div class="revel-izq">' +
            '<div class="j-preg en-revel' + (q.p.length > 110 ? ' larga' : '') + '">' + esc(q.p) + '</div>' +
            opcionesHtml(q, true) +
            '<div class="veredicto">' + PALOMITA + '<span>' + esc(recortar(q.resp || q.opciones[q.correctaIdx] || '', 60)) + '</span></div>' +
            (q.r ? '<div class="versiculo">' + esc(q.r) + '</div>' : '') +
          '</div>' +
          '<div class="revel-der">' +
            '<div class="top-tit">LOS MEJORES</div>' + top +
            (TOKEN
              ? '<button class="btn-avanzar" id="btn-avanzar">' + (d.idx + 1 < d.total ? 'SIGUIENTE ▶' : 'VER PODIO ▶') + '</button>'
              : '<div class="aviso-avanzar">La partida espera. Para pasar a la siguiente pregunta, tocá SIGUIENTE en el celular del anfitrión.</div>') +
          '</div>' +
        '</div>' +
      '</div>';
    var ba = document.getElementById('btn-avanzar');
    if (ba) ba.addEventListener('click', function () {
      if (ba.disabled) return;
      ba.disabled = true;
      ba.textContent = 'UN MOMENTO…';
      sndTic();
      mandar('siguiente');
    });
  }

  function vPodio(d) {
    var top = d.top || [];
    var medallero = [top[1], top[0], top[2]];
    var barras = medallero.map(function (j, i) {
      var lugar = i === 1 ? 0 : i === 0 ? 1 : 2;
      if (!j) return '<div class="pd-col"><div class="pd-barra b' + lugar + '"></div></div>';
      return '<div class="pd-col"><div class="pd-medalla">' + MEDALLAS[lugar] + '</div>' +
        '<div class="pd-apodo">' + esc(j.apodo) + '</div>' +
        '<div class="pd-pts">' + fmt(j.puntos) + '</div>' +
        '<div class="pd-barra b' + lugar + '"></div></div>';
    }).join('');
    var lista = top.map(function (j, i) {
      return '<div class="top-f' + (i === 0 ? ' primero' : '') + '">' +
        '<span class="pos">' + (i < 3 ? MEDALLAS[i] : (i + 1) + '°') + '</span>' +
        '<span class="apo">' + esc(j.apodo) + '</span>' +
        '<span class="pts">' + fmt(j.puntos) + '</span></div>';
    }).join('');
    V.innerHTML = marca() +
      '<div class="pd">' +
        '<div class="pd-saludo">¡SE TERMINÓ EL JUEGO!</div>' +
        '<div class="pd-rotulo">PODIO</div>' +
        '<div class="pd-zona">' +
          '<div class="pd-barras">' + barras + '</div>' +
          '<div class="pd-lista">' + lista + '</div>' +
        '</div>' +
      '</div>';
    if (!G.podioConfeti) { G.podioConfeti = true; confeti(); }
  }

  /* ---------- confeti (solo en el podio) ---------- */
  function confeti() {
    var cv = document.getElementById('confeti');
    var ctx = cv.getContext('2d');
    cv.width = innerWidth; cv.height = innerHeight;
    var colores = ['#E21B3C', '#1368CE', '#FFA602', '#26890C', '#ffffff'];
    var ps = [];
    for (var i = 0; i < 180; i++) ps.push({
      x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5,
      w: 7 + Math.random() * 8, h: 10 + Math.random() * 10,
      c: colores[Math.floor(Math.random() * colores.length)],
      vy: 2.6 + Math.random() * 3.4, vx: -1.8 + Math.random() * 3.6,
      a: Math.random() * Math.PI, va: -.14 + Math.random() * .28
    });
    var t0 = performance.now();
    (function animar(t) {
      ctx.clearRect(0, 0, cv.width, cv.height);
      for (var i = 0; i < ps.length; i++) {
        var p = ps[i];
        p.x += p.vx; p.y += p.vy; p.a += p.va;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
        ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      if (t - t0 < 4200) requestAnimationFrame(animar); else ctx.clearRect(0, 0, cv.width, cv.height);
    })(t0);
  }

  /* ---------- pantalla completa + pantalla despierta ---------- */
  document.getElementById('btn-fs').addEventListener('click', function () {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    } catch (e) {}
  });
  try {
    if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {});
  } catch (e) {}

  /* ---------- sonido: botón de muteo + preferencia guardada ---------- */
  SND.on = (function () { try { return localStorage.getItem('fequiz_son') !== '0'; } catch (e) { return true; } })();
  sndPinta();
  document.getElementById('btn-son').addEventListener('click', function () {
    SND.on = !SND.on;
    try { localStorage.setItem('fequiz_son', SND.on ? '1' : '0'); } catch (e) {}
    sndPinta();
    if (!SND.on) { sndPararLobby(); }
    else { sndCtx(); if (G.ult && G.ult.estado === 'lobby' && !SND.intervalo) sndLobby(); }
  });
  document.addEventListener('click', sndDespertar, false);
  document.addEventListener('keydown', sndDespertar, false);
  document.addEventListener('touchstart', sndDespertar, false);

  /* ---------- arranque ---------- */
  if (PIN) {
    /* venís del botón PROYECTAR (o de un refresco con ?pin en el enlace) */
    recordar(PIN);
  } else {
    /* ¿hay un código guardado de hace menos de 3 horas? → reconectar solo */
    var g = null;
    try { g = JSON.parse(localStorage.getItem(CLAVE_PROY) || 'null'); } catch (e) {}
    if (g && g.pin && String(g.pin).length === 6 && Date.now() - (g.t || 0) < 3 * 60 * 60 * 1000) {
      PIN = String(g.pin);
      ponerPin(PIN);
      G.auto = true;
    } else {
      pantallaEntrada();
    }
  }
  sondear();
  setInterval(sondear, 1000);
  G.raf = requestAnimationFrame(ciclo);
})();
</script>
</body>
</html>
