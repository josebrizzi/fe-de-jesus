<style>

.dbtns{display:flex;gap:10px;margin-top:14px}
.dbtns button{flex:1;border:2px solid #dbdbdb;background:#fff;border-radius:10px;padding:12px;font-size:20px;font-weight:800;cursor:pointer;color:#8e8e8e}

#overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.25s;z-index:50}
#overlay.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:75vh;background:#fff;border-radius:20px 20px 0 0;transform:translateY(100%);transition:.3s;z-index:51;display:flex;flex-direction:column}
#sheet.on{transform:translateY(0)}
#sheet .hd{padding:10px 18px 6px;text-align:center}
#sheet .hd i{display:block;width:40px;height:4px;border-radius:2px;background:#dbdbdb;margin:0 auto}
#sheet h3{font-size:26px;text-align:center;margin:6px 0 2px}
#sheet .vv{font-size:16px;text-align:center;color:#8e8e8e;margin-bottom:8px}
#sheet .bd{overflow-y:auto;padding:4px 20px 26px;font-size:25px;line-height:1.8}
#sheet .bd p{margin-bottom:12px}
#sheet sup{color:#0095f6;font-weight:700;font-size:18px;margin-right:4px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:#262626;color:#fff;border-radius:20px;padding:10px 20px;font-size:18px;opacity:0;transition:.3s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

<header>
  <button onclick="location.href='index.html'">←</button>
  <div class="t" id="hdTitle"></div>

</header>

<div class="wrap" id="app"></div>

<div id="overlay" onclick="cerrarSheet()"></div>
<div id="sheet">
  <div class="hd"><i></i></div>
  <h3 id="shRef"></h3>
  <div class="vv" id="shVer"></div>
  <div class="bd" id="shBody"></div>
</div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="data-a.js"></script>
<script src="data-b.js"></script>
<script src="data-c.js"></script>
<script src="data-d.js"></script>
<script src="quiz-a.js"></script>
<script src="quiz-b.js"></script>
<script src="resumen.js"></script>

<script>
let API_BASE = null, BIBLE_VERSION = "RVR1960", apiOK = false;
var TELEFONO_INSTRUCTOR = "5491128945261";

async function discover(){
  if(API_BASE !== null) return;
  const bases = ["", "/fe-de-jesus", "..", "/biblia"];
  for(const b of bases){
    try{
      const r = await fetch(b + "/api/versions");
      if(!r.ok) continue;
      const vs = await r.json();
      API_BASE = b;
      BIBLE_VERSION = vs.find(v => /rvr.*196|1960/i.test(v)) || vs.find(v => /rvr/i.test(v)) || vs[0];
      apiOK = true;
      return;
    }catch(e){}
  }
  API_BASE = "";
}

const LIBROS = [
["Génesis","Gén","Gn","Gen",1],["Éxodo","Exodo","Éxo","Exo",2],["Levítico","Lev",3],["Números","Núm","Nm","Num",4],
["Deuteronomio","Deut","Dt",5],["Josué","Jos",6],["Jueces","Jue",7],["Rut","Rt",8],
["1 Samuel","1 Sam",9],["2 Samuel","2 Sam",10],["1 Reyes","1 Rey",11],["2 Reyes","2 Rey",12],
["1 Crónicas","1 Crón","1 Cro",13],["2 Crónicas","2 Crón","2 Cro",14],["Esdras","Esd",15],["Nehemías","Neh",16],
["Ester","Est",17],["Job",18],["Salmos","Salmo","Sal",19],["Proverbios","Prov",20],
["Eclesiastés","Ecl",21],["Cantares","Cant",22],["Isaías","Isa","Is",23],["Jeremías","Jer",24],
["Lamentaciones","Lam",25],["Ezequiel","Eze",26],["Daniel","Dan",27],["Oseas","Os",28],
["Joel",29],["Amós","Am",30],["Obadías","Obad",31],["Jonás","Jon",32],["Miqueas","Miq",33],
["Nahúm","Nah",34],["Habacuc","Hab",35],["Sofonías","Sof",36],["Hageo","Hag",37],
["Zacarías","Zac",38],["Malaquías","Mal",39],["Mateo","Mt",40],["Marcos","Mr","Mar",41],
["Lucas","Lc","Luc",42],["Juan","Jn",43],["Hechos","Hch","Hech",44],["Romanos","Rom","Ro",45],
["1 Corintios","1 Cor",46],["2 Corintios","2 Cor",47],["Gálatas","Gál","Gal",48],["Efesios","Efes","Ef",49],
["Filipenses","Filip","Fil",50],["Colosenses","Colos","Col",51],["1 Tesalonicenses","1 Tes",52],
["2 Tesalonicenses","2 Tes",53],["1 Timoteo","1 Tim",54],["2 Timoteo","2 Tim",55],["Tito","Tit",56],
["Filemón","Filem",57],["Hebreos","Heb",58],["Santiago","Stg","Sant",59],["1 Pedro","1 Ped",60],
["2 Pedro","2 Ped",61],["1 Juan","1 Jn",62],["2 Juan","2 Jn",63],["3 Juan","3 Jn",64],
["Judas","Jud",65],["Apocalipsis","Apoc","Ap",66]
];

function norm(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim(); }
const reLibros = LIBROS.flatMap(g => g.slice(0,-1)).sort((a,b) => b.length - a.length).map(x => x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|");
const V = "(\\d{1,3}(?:\\s?[-–—]\\s?\\d{1,3}(?::\\d{1,3})?)?(?:\\s?,\\s?\\d{1,3}(?:\\s?[-–—]\\s?\\d{1,3})?)*)";
const REF_RE = new RegExp("(?<![\\p{L}\\p{N}])((?:" + reLibros + ")\\.?\\s?\\d{1,3}(?::\\s?" + V + ")?)", "gu");
const REF_ONE = new RegExp("^(" + reLibros + ")\\.?\\s?(\\d{1,3})(?::\\s?" + V + ")?$","u");

function numeroLibro(nombre){
  const n = norm(nombre.replace(/\.$/,""));
  const g = LIBROS.find(g => g.slice(0,-1).some(a => norm(a) === n));
  return g ? g[g.length-1] : null;
}
function escapeHtml(t){ return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function linkRefs(texto){ return escapeHtml(texto).replace(REF_RE, (m, ref) => '<a class="ref" data-r="' + ref + '">' + ref + '</a>'); }
function chips(refs){
  const partes = refs.split(";").map(s => s.trim()).filter(Boolean);
  let libroPrev = "";
  return partes.map(p => {
    const m = p.match(/^([A-Za-zÁÉÍÓÚÜÑáéíóúüñ][^\d]*?)\.?\s?\d/);
    if(m && numeroLibro(m[1])) libroPrev = m[1].replace(/\.$/,"");
    else if(libroPrev) p = libroPrev + " " + p;
    return p;
  });
}

function parseOne(ref){
  const m = ref.replace(/\s+/g," ").match(REF_ONE);
  if(!m) return null;
  const b = numeroLibro(m[1]);
  if(!b) return null;
  return { b, c: +m[2], versos: m[3] || null };
}

async function fetchCap(b, c){
  const r = await fetch(API_BASE + "/api/verses?version=" + encodeURIComponent(BIBLE_VERSION) + "&book=" + b + "&chapter=" + c);
  if(!r.ok) throw 0;
  return r.json();
}

async function openRef(ref){
  const p = parseOne(ref);
  if(!p){ return; }
  document.getElementById("shRef").textContent = ref;
  document.getElementById("shVer").textContent = "Cargando…";
  document.getElementById("shBody").innerHTML = "";
  abrirSheet();
  try{
    await discover();
    let caps = [p.c];
    let rango = null;
    if(p.versos){
      const rm = p.versos.match(/^(\d+)\s?[-–—]\s?(\d{1,3})(?::(\d{1,3}))?$/);
      if(rm && rm[2]){
        if(rm[3] !== undefined){ caps = [+p.c, +rm[2]]; rango = { de:+rm[1], hasta:+rm[3], capFin:+rm[2] }; }
        else rango = { de:+p.versos.match(/^\d+/)[0], hasta:+rm[2], capFin:+p.c };
      } else if(p.versos.includes(",")){
        rango = { lista: p.versos.split(",").map(s=>+s.trim()) };
      } else if(/^\d+$/.test(p.versos.trim())){
        rango = { lista: [ +p.versos.trim() ] };
      }
    }
    const datos = await Promise.all(caps.map(c => fetchCap(p.b, c)));
    let html = "";
    const pintar = (versos, capN) => {
      let sel = versos;
      if(rango){
        if(rango.lista) sel = versos.filter(v => rango.lista.includes(+v.verse));
        else sel = versos.filter(v => +v.verse >= rango.de && +v.verse <= (capN === rango.capFin ? rango.hasta : 999));
      }
      sel.forEach(v => { html += '<p><sup>' + v.verse + '</sup>' + escapeHtml(v.text) + '</p>'; });
    };
    caps.forEach((c,i) => pintar(datos[i], c));
    document.getElementById("shVer").textContent = BIBLE_VERSION + (apiOK ? "" : " · modo sin conexión");
    document.getElementById("shBody").innerHTML = html || "<p>No se encontraron los versículos.</p>";
  }catch(e){
    document.getElementById("shVer").textContent = "";
    document.getElementById("shBody").innerHTML = '<p style="color:#8e8e8e">No se pudo cargar el texto bíblico. Verificá la conexión con la API de la Biblia.</p><p><a class="ref" style="pointer-events:none">' + ref + '</a></p>';
  }
}

function abrirSheet(){
  document.getElementById("sheet").classList.add("on");
  document.getElementById("overlay").classList.add("on");
}
function cerrarSheet(){
  document.getElementById("sheet").classList.remove("on");
  document.getElementById("overlay").classList.remove("on");
}
document.addEventListener("click", e => {
  const a = e.target.closest("a.ref");
  if(a) openRef(a.dataset.r);
});

const getDone = () => JSON.parse(localStorage.getItem("fej_done") || "{}");
const setDone = o => localStorage.setItem("fej_done", JSON.stringify(o));
const getDecs = () => JSON.parse(localStorage.getItem("fej_dec") || "{}");
const setDecs = o => localStorage.setItem("fej_dec", JSON.stringify(o));

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("on");
  setTimeout(() => t.classList.remove("on"), 2200);
}

const params = new URLSearchParams(location.search);
const dia = +params.get("dia") || 1;
const L = LECCIONES.find(x => x.d === dia) || LECCIONES[0];

/* GUARDIÁN PROGRESIVO */
const doneMapGuard = getDone();
if(L.d > 1 && !doneMapGuard[L.d - 1]){
  document.getElementById("app").innerHTML = '<div style="text-align:center;padding:60px 20px"><div style="font-size:64px">🔒</div><h2 style="font-size:22px;margin:16px 0 8px">Estudio bloqueado</h2><p style="font-size:17px;color:#666;line-height:1.6">Para hacer el Día ' + L.d + ', primero completá el <b>Día ' + (L.d-1) + '</b>.</p><button onclick="location.href=\'leccion.html?dia=' + (L.d-1) + '\'" style="margin-top:20px;background:#0095f6;color:#fff;border:none;border-radius:12px;padding:14px 24px;font-size:16px;font-weight:700;cursor:pointer">← Ir al Día ' + (L.d-1) + '</button><br><a href="index.html" style="display:inline-block;margin-top:14px;color:#0095f6;font-weight:600;font-size:15px">Volver al índice</a></div>';
  document.getElementById("btnDone").style.display = "none";
  throw new Error("bloqueado");
}
localStorage.setItem("fej_ultimo", L.d);
document.getElementById("hdTitle").textContent = "Día " + L.d + " de 20";
document.title = "Día " + L.d + " — " + L.t;
document.getElementById("btnDone").onclick = toggleDone;

const getResp = () => JSON.parse(localStorage.getItem("fej_resp_" + L.d) || "{}");
const saveResp = o => localStorage.setItem("fej_resp_" + L.d, JSON.stringify(o));

/* ESTADO DEL QUIZ (multiple choice) del día: { "3": {sel:"texto", ok:true, first:true, tries:1} } */
const getQuiz = () => JSON.parse(localStorage.getItem("fej_quiz_" + L.d) || "{}");
const saveQuiz = o => localStorage.setItem("fej_quiz_" + L.d, JSON.stringify(o));
let quizEstado = getQuiz();
function guardarQuiz(){ saveQuiz(quizEstado); }

function renderDone(){
  const hecho = !!getDone()[L.d];
  document.getElementById("btnDone").textContent = hecho ? "❤️" : "🤍";
  const b = document.getElementById("btnCplt");
  if(b){ b.classList.toggle("on", hecho); b.textContent = hecho ? "✓ Estudio completado" : "Marcar estudio como completado"; }
}
function toggleDone(){
  const o = getDone();
  const yaEstaba = !!o[L.d];
  if(yaEstaba){ delete o[L.d]; toast("Estudio desmarcado"); }
  else {
    o[L.d] = 1;
    toast("❤️ ¡Estudio " + L.d + " completado!");
    if(typeof window.fejRespaldo === "function") window.fejRespaldo();
    if(L.d === 20) setTimeout(function(){ location.href = "certificado.html"; }, 1200);
  }
  setDone(o);
  renderDone();
}

function card(innerHTML, extraClass){ return '<section class="card ' + (extraClass||"") + '">' + innerHTML + '</section>'; }
function listaHTML(items){
  return '<ul class="lis">' + items.map(it => '<li>' + linkRefs(it.x) + (it.r ? ' <span style="color:#8e8e8e;font-size:12px">(' + it.r + ')</span>' : "") + '</li>').join("") + '</ul>';
}
function extrasHTML(efs){
  if(!efs) return "";
  return efs.map(e => card(
    '<h2>' + e.tt + '</h2>' +
    (e.parrafo ? '<div class="des">' + linkRefs(e.parrafo) + '</div>' : "") +
    (e.columnas ? '<div class="colwrap">' + e.columnas.map(col => '<div><h4>' + col.ct + '</h4>' + listaHTML(col.items) + '</div>').join("") + '</div>' : "") +
    (e.lista ? listaHTML(e.lista) : "") +
    (e.nota ? '<div class="des" style="margin-top:10px;font-size:16px;color:#666">' + linkRefs(e.nota) + '</div>' : "")
  )).join("");
}

/* Mezcla las opciones al azar (Fisher-Yates). La correcta (posición 0 en quiz-*.js) viaja por su texto. */
function mezclar(arr){
  const a = arr.map(x => x);
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function render(){
  const deces = getDecs();
  const misResp = getResp();
  const perfil = JSON.parse(localStorage.getItem("fej_alumno") || "null");
  const hoy = new Date().toLocaleDateString("en-CA");
  const decFull = JSON.parse(localStorage.getItem("fej_decfull_" + L.d) || "null");

  let h = '<div class="hero" style="background:' + L.g + '"><div class="dia">DÍA ' + L.d + ' DE 20</div><div class="em">' + L.e + '</div><h1>' + escapeHtml(L.t) + '</h1></div>';

  if(L.i) h += card('<h2>📖 Introducción</h2><div class="intro">' + linkRefs(L.i) + '</div>');

  if(L.temas) h += L.temas.map(t =>
    card('<h2>✨ ' + escapeHtml(t.tt) + '</h2>' +
      t.ps.map(p => {
        const clave = L.d + ":" + p.n;
        const ops = (window.QUIZ && window.QUIZ[clave]) || null;
        const st = quizEstado[p.n];
        const respondida = !!(st && st.ok);
        const yaEscribio = !!(misResp[p.n] && misResp[p.n].trim());

        let cuerpo = "";
        if(ops){
          const lista = mezclar(ops);
          const LETRAS = ["A","B","C","D"];
          cuerpo =
            '<label class="respLbl">👆 Elegí la respuesta correcta:</label>' +
            '<div class="quiz" data-q="' + p.n + '">' +
              lista.map((o,i) => {
                const marcada = respondida && st.sel === o;
                return '<button type="button" class="opt' + (marcada ? " ok" : "") + '"' + (respondida ? " disabled" : "") + ' data-t="' + escapeHtml(o) + '"><span class="letra">' + LETRAS[i] + '</span><span>' + escapeHtml(o) + '</span></button>';
              }).join("") +
              '<div class="hint" id="hi_' + p.n + '">📖 Volvé a leer el versículo y probá de nuevo</div>' +
            '</div>';
        } else {
          cuerpo =
            '<label class="respLbl">✍️ Tu respuesta:</label>' +
            '<div class="motiva" id="mo_' + p.n + '"></div>' +
            '<textarea class="respTa" id="ta_' + p.n + '" oninput="guardarResp(' + p.n + ', this.value)">' + escapeHtml(misResp[p.n] || "") + '</textarea>';
        }

        return '<div class="preg">' +
           '<span class="pnum">' + p.n + '</span><span class="pq">' + escapeHtml(p.p) + '</span>' +
           '<div class="chips">' + chips(p.r).map(c => '<button class="chip" onclick="openRef(\'' + c.replace(/'/g,"\\'") + '\')">' + escapeHtml(c) + '</button>').join("") + '</div>' +
           cuerpo +
           '<div class="ensenanza ' + ((respondida || yaEscribio) ? "on" : "") + '" id="ens_' + p.n + '">' +
             '<div class="des">' + linkRefs((window.RESUMEN_ENSENANZA && window.RESUMEN_ENSENANZA[clave]) || p.des) + '</div>' +
           '</div>' +
         '</div>';
      }).join("")
    )).join("");

  const cq = contarQuiz();
  if(cq.total) h += '<div class="score" id="scoreBox"></div>';

  if(L.extras){
    const visibles = L.d === 20 ? L.extras : L.extras.filter(e => /^Sugerencias/i.test(e.tt));
    h += extrasHTML(visibles);
  }

  if(L.dec) h += '<section class="dec">' +
    '<h2>✍️ Decisión personal</h2>' +
    '<div class="des" style="margin-top:8px;font-size:18px">Después de haber leído y entendido, mi decisión personal es:</div>' +
    '<p>“' + escapeHtml(L.dec) + '”</p>' +
    '<label>Tu nombre</label>' +
    '<input id="decNombre" placeholder="Escribí tu nombre" value="' + escapeHtml(decFull && decFull.nombre ? decFull.nombre : (perfil && perfil.nombre ? perfil.nombre : "")) + '">' +
    '<label>Fecha</label>' +
    '<input type="date" id="decFecha" value="' + (decFull && decFull.fecha ? decFull.fecha : hoy) + '">' +
    '<div class="dbtns">' +
      '<button id="btnSi" class="' + (deces[L.d] === "si" ? "on-si" : "") + '" onclick="decidir(\'si\')">SÍ</button>' +
      '<button id="btnNo" class="' + (deces[L.d] === "no" ? "on-no" : "") + '" onclick="decidir(\'no\')">NO</button>' +
    '</div>' +
    '<a class="enviarBtn" id="btnEnviar" onclick="enviarRespuestas(event)">📤 Enviar mis respuestas y mi decisión al instructor</a>' +
  '</section>';

  if(L.d === 20) h += '<div class="fin20">JESÚS VIENE PRONTO 🎉<br><span style="font-weight:400;font-size:16px">¡Completaste los 20 estudios de Fe de Jesús!</span></div>' +
    '<a class="certBtn" href="certificado.html">🎓 Ver mi certificado</a>';

  h += '<button class="cplt" id="btnCplt" onclick="toggleDone()"></button>';

  const ant = LECCIONES.find(x => x.d === L.d - 1);
  const sig = LECCIONES.find(x => x.d === L.d + 1);
  const sigBloqueado = sig && !getDone()[L.d];
  h += '<div class="navg">' +
    '<button ' + (ant ? "" : "disabled") + ' onclick="location.href=\'leccion.html?dia=' + (L.d-1) + '\'">← Anterior</button>' +
    (sigBloqueado
      ? '<button class="prim" disabled>🔒 Completá este estudio para continuar</button>'
      : '<button class="prim" ' + (sig ? "" : "disabled") + ' onclick="location.href=\'leccion.html?dia=' + (L.d+1) + '\'">Siguiente →</button>') +
  '</div>';

  document.getElementById("app").innerHTML = h;
  renderDone();
  actualizarScore();
}

/* Puntaje del día: aciertos a la primera sobre el total de preguntas multiple choice */
function contarQuiz(){
  let total = 0, aciertos = 0, respondidas = 0;
  (L.temas || []).forEach(t => t.ps.forEach(p => {
    if(window.QUIZ && window.QUIZ[L.d + ":" + p.n]){
      total++;
      const st = quizEstado[p.n];
      if(st && st.ok){
        respondidas++;
        if(st.first) aciertos++;
      }
    }
  }));
  return { total: total, aciertos: aciertos, respondidas: respondidas };
}

function actualizarScore(){
  const box = document.getElementById("scoreBox");
  if(!box) return;
  const c = contarQuiz();
  if(!c.total || !c.respondidas) return;
  let msg = "🎯 Acertadas a la primera: " + c.aciertos + " de " + c.total;
  if(c.aciertos === c.total) msg += "<br>⭐ ¡Puntaje perfecto! ¡Bendecido estudio!";
  else msg += "<br><span style='font-weight:400;font-size:14px'>Cada respuesta acertada a la primera suma tu ⭐ — si te equivocás, volvé a intentar sin miedo.</span>";
  box.innerHTML = msg;
  box.classList.add("on");
}

/* Clic en una opción del multiple choice */
document.getElementById("app").addEventListener("click", function(e){
  const b = e.target.closest(".opt");
  if(!b || b.disabled) return;
  const qDiv = b.closest(".quiz");
  if(!qDiv) return;
  const n = +qDiv.getAttribute("data-q");
  const texto = b.getAttribute("data-t");
  const ops = window.QUIZ[L.d + ":" + n];
  if(!ops) return;
  const correcta = ops[0];

  if(texto === correcta){
    const primeraVez = !quizEstado[n];
    if(!quizEstado[n]) quizEstado[n] = { tries: 0 };
    quizEstado[n].sel = texto;
    quizEstado[n].ok = true;
    if(primeraVez) quizEstado[n].first = true;
    guardarQuiz();
    qDiv.querySelectorAll(".opt").forEach(o => {
      o.disabled = true;
      if(o.getAttribute("data-t") === texto) o.classList.add("ok");
    });
    const hi = document.getElementById("hi_" + n);
    if(hi) hi.classList.remove("on");
    const ens = document.getElementById("ens_" + n);
    if(ens && !ens.classList.contains("on")){
      ens.classList.add("on");
      ens.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
    toast("✅ ¡Correcto!");
    actualizarScore();
  } else {
    if(!quizEstado[n]) quizEstado[n] = { tries: 0 };
    quizEstado[n].tries = (quizEstado[n].tries || 0) + 1;
    guardarQuiz();
    b.classList.add("mal");
    setTimeout(() => b.classList.remove("mal"), 500);
    const hi = document.getElementById("hi_" + n);
    if(hi) hi.classList.add("on");
  }
});

function guardarResp(n, texto){
  const r = getResp();
  r[n] = texto;
  saveResp(r);
  const ens = document.getElementById("ens_" + n);
  if(ens){
    if(texto.trim() && !ens.classList.contains("on")){
      ens.classList.add("on");
      ens.scrollIntoView({ behavior: "smooth", block: "nearest" });
    } else if(!texto.trim()){
      ens.classList.remove("on");
    }
  }
  const motiva = document.getElementById("mo_" + n);
  if(motiva){
    const palabras = texto.trim().split(/\s+/).filter(Boolean).length;
    let msg = "";
    if(palabras >= 60) msg = "🌟 ¡WOW! " + palabras + " palabras — se nota que el Espíritu te está hablando. Tu reflexión va a bendecir a otros.";
    else if(palabras >= 35) msg = "🔥 ¡Excelente! " + palabras + " palabras. Tu respuesta es profunda — seguí así.";
    else if(palabras >= 15) msg = "💪 ¡Muy bien! " + palabras + " palabras. Agregá un ejemplo de tu vida y va a quedar aún mejor.";
    else if(palabras >= 5) msg = "👏 Buen comienzo. ¿Qué significa esto para vos personalmente?";
    else if(palabras >= 1) msg = "🌱 ¡Empezaste! Contá un poco más de qué se trata.";
    if(msg){
      motiva.textContent = msg;
      motiva.classList.add("on");
    }
  }
}

function decidir(v){
  const o = getDecs();
  o[L.d] = v;
  setDecs(o);
  const nombre = (document.getElementById("decNombre").value || "").trim();
  const fecha = document.getElementById("decFecha").value || "";
  localStorage.setItem("fej_decfull_" + L.d, JSON.stringify({ nombre: nombre, fecha: fecha, dec: v }));
  document.getElementById("btnSi").className = v === "si" ? "on-si" : "";
  document.getElementById("btnNo").className = v === "no" ? "on-no" : "";
  toast(v === "si" ? "✅ ¡Bendecida decisión!" : "Decisión guardada");
}

function enviarRespuestas(ev){
  if(ev) ev.preventDefault();
  const deces = getDecs();
  const perfil = JSON.parse(localStorage.getItem("fej_alumno") || "null");
  const nombre = (document.getElementById("decNombre").value || "").trim() || (perfil && perfil.nombre) || "Sin nombre";
  const fecha = document.getElementById("decFecha").value || "";
  const misResp = getResp();
  const cq = contarQuiz();
  let txt = "📖 *Fe de Jesús — Día " + L.d + "*\n*" + L.t + "*\n\n👤 " + nombre + "\n📅 " + fecha + "\n\n✍️ *Mis respuestas:*\n";
  let hay = false;
  (L.temas || []).forEach(t => t.ps.forEach(p => {
    const st = quizEstado[p.n];
    if(st && st.ok){ hay = true; txt += "\n*" + p.n + ". " + p.p + "*\n→ ✅ " + st.sel + "\n"; return; }
    const r = (misResp[p.n] || "").trim();
    if(r){ hay = true; txt += "\n*" + p.n + ". " + p.p + "*\n→ " + r + "\n"; }
  }));
  if(!hay) txt += "(sin respuestas registradas)\n";
  if(cq.total) txt += "\n🎯 *Acertadas a la primera:* " + cq.aciertos + " de " + cq.total;
  txt += "\n\n✍️ *Mi decisión personal:* " + (deces[L.d] === "si" ? "SÍ" : deces[L.d] === "no" ? "NO" : "sin marcar");
  if(typeof window.fejRegistrar === "function"){
    window.fejRegistrar("Envió sus respuestas", "Lección " + L.d + (cq.total ? " | Quiz " + cq.aciertos + "/" + cq.total : ""));
    if(typeof window.fejRespaldo === "function") window.fejRespaldo();
  }
  window.open("https://wa.me/" + TELEFONO_INSTRUCTOR + "?text=" + encodeURIComponent(txt), "_blank");
}

render();
discover();
</script>

<script>
/* ORACIÓN SENCILLA — una por día, según el tema */
(function(){
  function colocar(){
    var app = document.getElementById("app");
    if(!app || !app.querySelector(".hero")) return false;

    var temas = {
      1:"entender que la Biblia es Tu Palabra inspirada",
      2:"conocer a Dios como Padre lleno de amor",
      3:"aprender a orar y confiar en Ti",
      4:"entender de dónde vino el sufrimiento y cómo vencerlo",
      5:"comprender la salvación que Jesús logró para mí",
      6:"recibir Tu perdón y perdonar de corazón",
      7:"esperar con fe el regreso de Jesús",
      8:"reconocer las señales de Tu venida",
      9:"descansar en la promesa de la resurrección",
      10:"confiar en Jesús, mi Abogado en el Juicio",
      11:"guardar Tu Ley escrita en mi corazón",
      12:"valorar el sábado como Tu regalo",
      13:"hacer del sábado mi día más feliz",
      14:"encontrar la iglesia que Tú preparaste",
      15:"decidirme al bautismo siguiendo a Jesús",
      16:"crecer cada día como discípulo tuyo",
      17:"cuidar mi cuerpo como templo de Tu Espíritu",
      18:"ser fiel mayordomo de lo que me das",
      19:"valorar la guía que das a Tu iglesia",
      20:"abrirte la puerta de mi corazón para siempre"
    };

    var d = +(new URLSearchParams(location.search).get("dia")) || 1;
    var tema = temas[d] || "entender las verdades de este estudio";

    var card = document.createElement("section");
    card.className = "card oracion";
    card.innerHTML =
      '<h2>🙏 Orá antes de comenzar:</h2>' +
      '<div class="pedir">"Padre celestial, en el nombre de Jesús, te pido que tu Espíritu Santo me ayude a ' + tema + '. Amén."</div>';

    var hero = app.querySelector(".hero");
    if(hero && hero.nextSibling) app.insertBefore(card, hero.nextSibling);
    else app.insertBefore(card, app.firstChild);
    return true;
  }
  var timer = setInterval(function(){ if(colocar()) clearInterval(timer); }, 250);
})();
</script>
